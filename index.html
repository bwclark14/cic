<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDU Explorer</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>

    <style type="text/tailwindcss">
        @layer components {
            .badge  { @apply inline-flex items-center rounded-md border px-2 py-0.5 text-[11px] font-bold uppercase tracking-wide; }
            .chip   { @apply rounded-full border px-3 py-1.5 text-xs font-medium transition text-left; }
            .btn    { @apply inline-flex items-center justify-center gap-1.5 rounded-xl border px-3 py-2 text-sm font-semibold transition; }
            .btn-more { @apply inline-flex items-center gap-1 rounded-lg border border-indigo-200 bg-indigo-50 px-2 py-1 text-xs font-semibold text-indigo-700 transition hover:bg-indigo-100; }
            .btn-note { @apply inline-flex items-center gap-1 rounded-lg border border-amber-200 bg-amber-50 px-2 py-1 text-xs font-semibold text-amber-800 transition hover:bg-amber-100; }
            .panel  { @apply rounded-2xl border border-slate-200 bg-white shadow-sm; }
            .eyebrow { @apply text-[11px] font-bold uppercase tracking-wider text-slate-400; }
            .area-bar { @apply flex items-center justify-between gap-3 rounded-2xl bg-gradient-to-r from-indigo-900 to-violet-900 px-4 py-3 text-white; }
        }
    </style>
    <style>
        [x-cloak] { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Fit-to-width tables (Summary, Understanding Matrix, Know & Do): no sideways scrolling; stack on phones */
        .fit-table { font-size: 12px; line-height: 1.35; }
        .fit-table.is-dense, .fit-table.is-dense .text-xs { font-size: 11px; }
        .fit-table ul, .fit-table p, .fit-table li, .fit-table button, .fit-table span { overflow-wrap: anywhere; }
        .fit-table .badge { font-size: 10px; }
        @media (max-width: 767px) {
            .fit-table, .fit-table thead, .fit-table tbody, .fit-table tr,
            .fit-table th.fit-area, .fit-table td { display: block; width: 100%; }
            .fit-table thead { display: none; }
            .fit-table tbody tr { border-bottom: 8px solid #f1f5f9; }
            .fit-table th.fit-area { border-right: 0; padding: .6rem .8rem; }
            .fit-table td { border-right: 0; border-top: 1px solid #f1f5f9; padding: .65rem .8rem; font-size: 13px; }
            .fit-table td .text-xs { font-size: 12px; }
            .fit-table td.fit-empty { display: none; }
            .fit-table td::before {
                content: attr(data-level); display: inline-block; margin-bottom: .4rem; padding: .1rem .5rem;
                border-radius: .4rem; background: #eef2ff; color: #3730a3; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
            }
        }
        /* Hierarchy tree: elbow connectors between parent and child nodes */
        .tree { --indent: 1.1rem; --gap: 1.35rem; --line: #cbd5e1; }
        .tree-children { position: relative; margin-left: var(--indent); padding-left: var(--gap); }
        .tree-node { position: relative; padding-top: .6rem; }
        .tree-node::before {            /* vertical trunk */
            content: ""; position: absolute; left: calc(-1 * var(--gap)); top: 0; bottom: 0;
            border-left: 2px solid var(--line);
        }
        .tree-node:last-child::before { bottom: auto; height: 1.95rem; }
        .tree-node::after {             /* horizontal elbow */
            content: ""; position: absolute; left: calc(-1 * var(--gap)); top: 1.95rem; width: var(--gap);
            border-top: 2px solid var(--line);
        }
        .tree-label { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: .75rem; text-align: left; border-radius: .75rem; padding: .55rem .8rem; }
        @media (max-width: 640px) { .tree { --indent: .45rem; --gap: 1rem; } }
        @media print {
            body { background: #fff !important; }
            header, .no-print { display: none !important; }
            .panel, .shadow-sm { box-shadow: none !important; }
            .overflow-x-auto { overflow: visible !important; }
        }
    </style>
</head>

<body class="bg-slate-50 font-sans text-sm text-slate-800 antialiased selection:bg-indigo-500 selection:text-white"
      x-data="curriculumApp()" @keydown.escape.window="closeModals()">

    <!-- ============ Header ============ -->
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur">
        <div class="mx-auto max-w-[1600px] space-y-3 px-4 py-3 sm:px-6">
            <div class="flex items-center justify-between gap-3">
                <div class="flex min-w-0 items-center gap-3">
                    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 text-white shadow-md shadow-indigo-200">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div class="min-w-0">
                        <h1 class="truncate text-base font-bold leading-tight text-slate-900">KDU Explorer</h1>
                        <p class="truncate text-xs text-slate-500">Know, Do and Understand Framework</p>
                    </div>
                </div>
                <button @click="exportPdf()" title="Export PDF"
                        class="btn no-print shrink-0 border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100">
                    <i class="fa-solid fa-file-pdf"></i><span class="hidden sm:inline">Export PDF</span>
                </button>
            </div>

            <nav class="no-scrollbar no-print -mx-4 flex gap-1.5 overflow-x-auto px-4 sm:mx-0 sm:px-0" aria-label="Views">
                <template x-for="v in views" :key="v.id">
                    <button @click="view = v.id"
                            :class="view === v.id ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                            class="flex shrink-0 items-center gap-2 rounded-xl px-3.5 py-2 text-sm font-semibold transition">
                        <i :class="v.icon"></i><span x-text="v.label"></span>
                    </button>
                </template>
            </nav>
        </div>
    </header>

    <main class="mx-auto w-full max-w-[1600px] space-y-5 px-4 py-5 sm:px-6">

        <!-- Loading -->
        <template x-if="loading">
            <div class="flex flex-col items-center justify-center space-y-4 py-24">
                <div class="h-12 w-12 animate-spin rounded-full border-4 border-indigo-200 border-t-indigo-600"></div>
                <p class="animate-pulse font-medium text-slate-600">Loading curriculum data…</p>
            </div>
        </template>

        <!-- Error -->
        <template x-if="error">
            <div class="mx-auto my-10 max-w-lg rounded-2xl border border-red-200 bg-red-50 p-6 text-center shadow-sm">
                <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-red-100 text-red-600">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h3 class="mb-1 font-semibold text-red-900">Failed to load curriculum</h3>
                <p class="mb-4 text-red-600" x-text="error"></p>
                <button @click="init()" class="btn border-red-600 bg-red-600 text-white hover:bg-red-700">Try again</button>
            </div>
        </template>

        <template x-if="!loading && !error">
            <div class="space-y-5">

                <!-- Data warnings -->
                <template x-if="warnings.length">
                    <div class="rounded-2xl border border-amber-200 bg-amber-50 p-4 text-amber-900">
                        <template x-for="w in warnings" :key="w">
                            <p class="flex gap-2"><i class="fa-solid fa-circle-exclamation mt-0.5"></i><span x-text="w"></span></p>
                        </template>
                    </div>
                </template>

                <!-- ============ Filters ============ -->
                <section class="panel no-print space-y-3 p-3 sm:p-4">
                    <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
                        <div class="relative flex-1">
                            <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="search" :value="filters.search"
                                   @input.debounce.250ms="setSearch($event.target.value)"
                                   placeholder="Search the curriculum…"
                                   class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2.5 pl-10 pr-4 focus:border-indigo-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-200">
                        </div>
                        <div class="flex gap-2">
                            <button @click="filtersOpen = !filtersOpen"
                                    class="btn flex-1 border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 sm:flex-none">
                                <i class="fa-solid fa-filter"></i>
                                <span>Filters</span>
                                <span x-show="activeFilterCount" class="rounded-full bg-indigo-600 px-1.5 text-[11px] text-white" x-text="activeFilterCount"></span>
                                <i class="fa-solid fa-chevron-down text-[10px] transition-transform" :class="filtersOpen && 'rotate-180'"></i>
                            </button>
                            <button @click="resetFilters()" class="btn flex-1 border-slate-200 bg-white text-slate-600 hover:bg-slate-50 sm:flex-none">
                                <i class="fa-solid fa-rotate-right"></i><span>Reset</span>
                            </button>
                        </div>
                    </div>

                    <p class="text-xs font-medium text-slate-500" x-text="filtered.length + ' of ' + items.length + ' records'"></p>

                    <div x-show="filtersOpen" x-transition class="grid gap-4 border-t border-slate-100 pt-4 md:grid-cols-2">
                        <!-- Area -->
                        <div class="space-y-1.5">
                            <label class="eyebrow" for="areaSelect">Curriculum area</label>
                            <select id="areaSelect" x-model="filters.area" @change="apply()"
                                    class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 font-medium focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-200">
                                <option value="">All curriculum areas</option>
                                <template x-for="a in allAreas" :key="a">
                                    <option :value="a" x-text="a"></option>
                                </template>
                            </select>
                        </div>

                        <!-- Levels -->
                        <div class="space-y-1.5">
                            <div class="flex items-center justify-between">
                                <span class="eyebrow">Levels</span>
                                <button x-show="filters.levels.length" @click="clearFilter('levels')" class="text-xs font-medium text-indigo-600">Clear</button>
                            </div>
                            <div class="flex flex-wrap gap-1.5">
                                <template x-for="l in options.levels" :key="l">
                                    <button @click="toggleFilter('levels', l)" class="chip"
                                            :class="filters.levels.includes(l) ? levelClass(l) + ' ring-2 ring-indigo-300' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'"
                                            x-text="l"></button>
                                </template>
                            </div>
                        </div>

                        <!-- Strands & sub-strands: multi-select dropdowns -->
                        <template x-for="f in multiFilters" :key="f.key">
                            <div class="relative space-y-1.5" x-data="{ open: false, q: '' }"
                                 @click.outside="open = false" @keydown.escape.stop="open = false">
                                <div class="flex items-center justify-between">
                                    <span class="eyebrow" x-text="f.label"></span>
                                    <button x-show="filters[f.key].length" @click="clearFilter(f.key)" class="text-xs font-medium text-indigo-600">Clear</button>
                                </div>
                                <button type="button" @click="open = !open"
                                        :aria-expanded="open"
                                        :class="filters[f.key].length ? 'border-indigo-300 bg-indigo-50/50' : 'border-slate-200 bg-white'"
                                        class="flex w-full items-center justify-between gap-2 rounded-xl border px-3 py-2.5 text-left font-medium focus:outline-none focus:ring-2 focus:ring-indigo-200">
                                    <span class="truncate" x-text="multiLabel(f)"></span>
                                    <i class="fa-solid fa-chevron-down shrink-0 text-[10px] text-slate-400 transition-transform" :class="open && 'rotate-180'"></i>
                                </button>

                                <div x-show="open" x-transition x-cloak
                                     class="absolute left-0 right-0 z-20 mt-1 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-lg">
                                    <div class="border-b border-slate-100 p-2">
                                        <input type="search" x-model="q" :placeholder="'Search ' + f.label.toLowerCase() + '…'"
                                               class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 focus:border-indigo-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-200">
                                    </div>
                                    <div class="flex items-center justify-between px-3 py-1.5 text-xs font-medium">
                                        <button @click="selectOptions(f.key, optionsMatching(f.key, q))" class="text-indigo-600 hover:underline">Select all<span x-show="q"> shown</span></button>
                                        <button @click="clearFilter(f.key)" class="text-slate-500 hover:underline">Clear</button>
                                    </div>
                                    <ul class="max-h-64 overflow-y-auto p-1">
                                        <template x-for="o in optionsMatching(f.key, q)" :key="o">
                                            <li>
                                                <label class="flex cursor-pointer items-start gap-2.5 rounded-lg px-2.5 py-2 hover:bg-slate-50">
                                                    <input type="checkbox" class="mt-0.5 h-4 w-4 shrink-0 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                                                           :checked="filters[f.key].includes(o)" @change="toggleFilter(f.key, o)">
                                                    <span class="leading-snug" x-text="o"></span>
                                                </label>
                                            </li>
                                        </template>
                                        <li x-show="!optionsMatching(f.key, q).length" class="px-3 py-3 text-center text-xs text-slate-400">No matches</li>
                                    </ul>
                                </div>

                                <div x-show="filters[f.key].length" class="flex flex-wrap gap-1 pt-0.5">
                                    <template x-for="v in filters[f.key]" :key="v">
                                        <button @click="toggleFilter(f.key, v)"
                                                class="flex items-center gap-1 rounded-full bg-indigo-600 px-2.5 py-1 text-xs font-medium text-white hover:bg-indigo-700">
                                            <span x-text="v"></span><i class="fa-solid fa-xmark text-[10px]"></i>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </section>

                <!-- ============ Purpose statement banner (per curriculum area) ============ -->
                <template x-if="purpose">
                    <section class="space-y-4 rounded-2xl border border-indigo-700 bg-gradient-to-br from-indigo-900 via-indigo-800 to-violet-900 p-4 text-white shadow-xl sm:p-6"
                             x-data="{ open: window.innerWidth >= 768 }">
                        <button @click="open = !open" :aria-expanded="open" class="flex w-full items-center justify-between gap-3 text-left">
                            <span class="flex items-center gap-3">
                                <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white/10"><i class="fa-solid" :class="purpose.icon"></i></span>
                                <span>
                                    <span class="block text-base font-bold sm:text-lg" x-text="purpose.title"></span>
                                    <span class="block text-xs text-indigo-200" x-text="purpose.subtitle"></span>
                                </span>
                            </span>
                            <i class="fa-solid fa-chevron-down text-xs transition-transform" :class="open && 'rotate-180'"></i>
                        </button>

                        <div x-show="open" x-transition class="space-y-5 border-t border-indigo-700/60 pt-4">
                            <div class="space-y-3">
                                <template x-for="(para, pi) in purpose.paragraphs" :key="pi">
                                    <p class="leading-relaxed text-indigo-100" x-text="para"></p>
                                </template>
                            </div>
                            <h3 class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-indigo-200">
                                <i class="fa-solid fa-lightbulb text-amber-300"></i>Big Ideas
                            </h3>
                            <div class="grid gap-3" :class="purpose.bigIdeas.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-2 xl:grid-cols-3'">
                                <template x-for="(idea, ii) in purpose.bigIdeas" :key="ii">
                                    <div class="space-y-2 rounded-xl border border-white/10 bg-white/10 p-4">
                                        <div class="font-bold" :class="IDEA_COLOURS[ii % IDEA_COLOURS.length]" x-text="idea.title"></div>
                                        <p class="leading-relaxed text-indigo-100" x-text="idea.text"></p>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </section>
                </template>

                <!-- ============ Empty state ============ -->
                <template x-if="!filtered.length">
                    <div class="panel p-12 text-center text-slate-500">
                        <i class="fa-regular fa-folder-open mb-3 text-3xl text-slate-300"></i>
                        <p class="font-medium">No matching curriculum items</p>
                        <p class="mt-1 text-xs text-slate-400">Try a broader search or clear some filters.</p>
                    </div>
                </template>

                <!-- ============ Summary view ============ -->
                <template x-if="filtered.length && view === 'summary'">
                    <section class="space-y-3">
                        <div class="flex flex-col gap-2 lg:flex-row lg:items-center lg:justify-between">
                            <p class="text-xs text-slate-500">Curriculum areas (rows) by level (columns). Drill down for every cell at once, or use the buttons inside a cell to drill into just that one.</p>
                            <div class="no-print inline-flex shrink-0 self-start rounded-xl bg-slate-200/70 p-1">
                                <template x-for="d in depthOptions" :key="d.id">
                                    <button @click="setAllDepths(d.id)"
                                            :class="summaryDepth === d.id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'"
                                            class="rounded-lg px-3 py-1.5 text-xs font-semibold transition" x-text="d.label"></button>
                                </template>
                            </div>
                        </div>

                        <div class="panel overflow-hidden">
                            <table class="fit-table w-full table-fixed border-collapse break-words"
                                   :class="summary.levels.length > 5 ? 'is-dense' : ''">
                                <thead>
                                    <tr class="border-b border-slate-200 bg-slate-50">
                                        <th class="fit-area w-28 border-r border-slate-200 bg-slate-50 p-2 text-left text-[11px] font-bold uppercase tracking-wider text-slate-500 lg:w-36 lg:p-3">Curriculum area</th>
                                        <template x-for="lv in summary.levels" :key="lv">
                                            <th class="border-r border-slate-100 p-2 text-left lg:p-3">
                                                <span class="badge" :class="levelClass(lv)" x-text="lv"></span>
                                            </th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    <template x-for="row in summary.rows" :key="row.area">
                                        <tr class="align-top">
                                            <th scope="row" class="fit-area border-r border-slate-200 bg-slate-50 p-2 text-left text-[11px] font-bold uppercase tracking-wide text-indigo-900 lg:p-3 lg:text-xs" x-text="row.area"></th>
                                            <template x-for="lv in summary.levels" :key="lv">
                                                <td class="fit-cell border-r border-slate-100 p-2 lg:p-3"
                                                    :data-level="lv" :class="!row.cells[lv].statements.length && 'fit-empty'">
                                                    <template x-if="row.cells[lv].statements.length">
                                                        <div class="space-y-3">
                                                            <!-- per-cell drill-down control -->
                                                            <div class="no-print flex w-fit max-w-full flex-wrap rounded-lg bg-slate-100 p-0.5">
                                                                <template x-for="d in depthOptions" :key="d.id">
                                                                    <button @click="setCellDepth(cellKey(row, lv), d.id)"
                                                                            :class="depthFor(cellKey(row, lv)) === d.id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'"
                                                                            class="rounded-md px-2 py-1 text-[10px] font-semibold transition" x-text="d.short"></button>
                                                                </template>
                                                            </div>

                                                            <!-- level 0: understanding statements -->
                                                            <template x-if="depthFor(cellKey(row, lv)) === 0">
                                                                <ul class="list-disc space-y-2 pl-4 leading-relaxed text-slate-800">
                                                                    <template x-for="(s, i) in row.cells[lv].statements" :key="i">
                                                                        <li x-text="s"></li>
                                                                    </template>
                                                                </ul>
                                                            </template>

                                                            <!-- level 1: strands + understanding statements -->
                                                            <template x-if="depthFor(cellKey(row, lv)) === 1">
                                                                <div class="space-y-3">
                                                                    <template x-for="st in row.cells[lv].strands" :key="st.strand">
                                                                        <div class="space-y-1">
                                                                            <p class="text-xs font-bold text-indigo-700" x-text="st.strand"></p>
                                                                            <ul class="list-disc space-y-1.5 pl-4 leading-relaxed text-slate-800">
                                                                                <template x-for="(g, gi) in st.groups" :key="gi">
                                                                                    <li x-text="g.statement"></li>
                                                                                </template>
                                                                            </ul>
                                                                        </div>
                                                                    </template>
                                                                </div>
                                                            </template>

                                                            <!-- level 2: strands + understanding + know & do -->
                                                            <template x-if="depthFor(cellKey(row, lv)) === 2">
                                                                <div class="space-y-4">
                                                                    <template x-for="st in row.cells[lv].strands" :key="st.strand">
                                                                        <div class="space-y-2">
                                                                            <p class="text-xs font-bold text-indigo-700" x-text="st.strand"></p>
                                                                            <template x-for="(g, gi) in st.groups" :key="gi">
                                                                                <div class="space-y-2 rounded-xl border border-slate-200 bg-slate-50 p-2.5">
                                                                                    <p class="font-semibold leading-snug text-slate-900" x-text="g.statement"></p>
                                                                                    <template x-for="it in g.items" :key="it.id">
                                                                                        <div class="space-y-1.5">
                                                                                            <div class="flex flex-wrap items-center justify-between gap-1.5">
                                                                                                <button @click="openDetail(it)" class="text-left text-[11px] font-semibold text-indigo-600 hover:underline">
                                                                                                    <i class="fa-solid fa-tag mr-1 text-[9px] opacity-70"></i><span x-text="it.subStrand"></span><span x-show="it.subSubStrand" x-text="' (' + it.subSubStrand + ')'"></span>
                                                                                                </button>
                                                                                                <div class="flex flex-wrap items-center gap-1.5">
                                                                                                    <button x-show="it.hasNotes" @click="openNotes(it)" class="btn-note"><i class="fa-solid fa-note-sticky"></i>Notes</button>
                                                                                                    <button x-show="it.hasMore" @click="openMore(it)" class="btn-more"><i class="fa-solid fa-circle-info"></i>More info</button>
                                                                                                </div>
                                                                                            </div>
                                                                                            <div class="space-y-1.5 text-xs" x-html="knowDoHtml(it)"></div>
                                                                                        </div>
                                                                                    </template>
                                                                                </div>
                                                                            </template>
                                                                        </div>
                                                                    </template>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>

                            <p x-show="block.heading" class="font-bold text-amber-900 underline" x-text="block.heading"></p>

    </div>

    <!-- ============ More information modal (vocabulary, deep dive, resources) ============ -->
    <div x-show="moreItem" x-cloak x-transition.opacity @click.self="moreItem = null"
         class="fixed inset-0 z-[70] flex items-end justify-center bg-slate-900/50 backdrop-blur-sm sm:items-center sm:p-4">
        <div class="max-h-[88vh] w-full max-w-2xl space-y-5 overflow-y-auto rounded-t-2xl bg-white p-5 shadow-2xl sm:rounded-2xl">
            <template x-if="moreItem">
                <div class="space-y-5">
                    <div class="flex items-start justify-between gap-3">
                        <div class="space-y-1.5">
                            <h3 class="flex items-center gap-2 font-bold text-slate-900"><i class="fa-solid fa-circle-info text-indigo-600"></i>More information</h3>
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="badge" :class="levelClass(moreItem.level)" x-text="moreItem.level"></span>

                        </div>

                    <template x-if="moreItem.vocabTerms.length">
                        <section class="space-y-2">
                            <h4 class="eyebrow flex items-center gap-1.5"><i class="fa-solid fa-spell-check"></i>Vocabulary</h4>
                            <dl class="divide-y divide-slate-100 rounded-xl border border-slate-200">
                                <template x-for="entry in vocabEntries(moreItem)" :key="entry.term">

                                        <dt class="font-semibold text-indigo-900" x-text="entry.term"></dt>
                                        <template x-for="(def, di) in entry.defs" :key="di">
                                            <dd class="leading-relaxed text-slate-700" x-text="def"></dd>
                                        </template>
                                        <dd x-show="!entry.defs.length" class="text-xs italic text-slate-400"
                                            x-text="vocabLoaded ? 'No definition found for this term.' : (vocabFailed ? 'Definitions could not be loaded.' : 'Loading definitions…')"></dd>
                                    </div>

                    <!-- Deep dive -->
                    <template x-if="moreItem.deepParas.length">
                        <section class="space-y-2">
                            <h4 class="eyebrow flex items-center gap-1.5"><i class="fa-solid fa-graduation-cap"></i>Deep dive</h4>
                            <div class="space-y-2.5 rounded-xl border border-violet-100 bg-violet-50/60 p-3.5">
                                <template x-for="(para, pi) in moreItem.deepParas" :key="pi">

                    </template>

                    <!-- Resources -->
                    <template x-if="moreItem.resources.length">
                        <section class="space-y-2">
                            <h4 class="eyebrow flex items-center gap-1.5"><i class="fa-solid fa-link"></i>Resources</h4>
                            <ul class="space-y-1.5">
                                <template x-for="(r, ri) in moreItem.resources" :key="ri">
                                    <li>
                                        <template x-if="r.url">
                                            <a :href="r.url" target="_blank" rel="noopener noreferrer"
                                               class="flex items-start gap-2.5 rounded-xl border border-slate-200 px-3 py-2.5 transition hover:border-indigo-300 hover:bg-indigo-50">
                                                <i class="fa-solid fa-arrow-up-right-from-square mt-1 text-xs text-indigo-500"></i>
                                                <span class="min-w-0">
                                                    <span class="block break-words font-semibold text-indigo-700" x-text="r.label"></span>
                                                    <span class="block break-all text-xs text-slate-400" x-text="r.host"></span>
                                                </span>
                                            </a>
                                        </template>
                                        <template x-if="!r.url"><span class="block rounded-xl border border-slate-200 px-3 py-2.5 text-slate-700" x-text="r.label"></span></template>
                                    </li>
                                </template>
                            </ul>
                        </section>
                    </template>
                </div>
            </template>
        </div>
    </div>

    <script>
    /* =====================================================================
       Config
       ===================================================================== */
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTh6rBdn3GxwpFQtVpUwNr6ACdipDW-eDR7Diu9l_3DOkQ0hsTdMIMp8D0BETaGKxYk9pY5HM6ZbkWN/pub?gid=0&single=true&output=csv';

    // Vocabulary definitions live on a second tab of the same published sheet.
    const VOCAB_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTh6rBdn3GxwpFQtVpUwNr6ACdipDW-eDR7Diu9l_3DOkQ0hsTdMIMp8D0BETaGKxYk9pY5HM6ZbkWN/pub?gid=223106995&single=true&output=csv';

    const PAGE_SIZE = 12;

    // Purpose statements and big ideas, shown when a single curriculum area is selected.
    // `match` is tested against the selected area name.
    const IDEA_COLOURS = ['text-amber-300', 'text-emerald-300', 'text-cyan-300', 'text-rose-300', 'text-violet-300'];

    const PURPOSE_STATEMENTS = [
        {
            match: /technolog/i,
            icon: 'fa-microchip',
            title: 'Technologies Purpose Statement',
            subtitle: 'Technology and Innovation curriculum framework overview',
            paragraphs: [
                `The Technology and Innovation curriculum gives children and young people opportunities to learn with, through and about technology to be creative, critical thinkers who use ethical, sustainable, and innovative approaches to address real world challenges, bridging theory and practice while preparing them to thrive as adaptable, socially aware citizens in a dynamic, inclusive, and rapidly evolving world.`
            ],
            bigIdeas: [
                { title: '1. Understanding Our World', text: `We live in a complex world full of physical, digital, social, and economic systems. Modern living requires critically evaluating the products and decisions that shape the world around them and understanding how data is created and used, and how systems recognise patterns.` },
                { title: '2. Innovation', text: `Engaging with our world requires the confident use of tools, materials, and processes to create products and services. Practical skills like designing, making, testing, and refining are essential to tackling real-world challenges.` },
                { title: '3. Shaping Our Future', text: `Every technological decision has economic, environmental, and social impacts. By critiquing the implications of technology, learners develop the capacity to make responsible choices and actively shape a more sustainable and equitable future.` }
            ]
        },
        {
            match: /social\s*stud/i,
            icon: 'fa-earth-europe',
            title: 'Social Studies Purpose Statement',
            subtitle: 'Social Studies curriculum framework overview',
            paragraphs: [
                `Social Studies supports children and young people to understand who they are, how they relate to others and how people are connected across time and place. It begins with them – their identities, their relationships and their place in the world – and extends outward to explore wider communities, societies and environments.`,
                `Through Social Studies, children and young people build knowledge and understanding of how people live together, how decisions are made and how the past and present shape the world and influence possible futures. They develop an awareness of rights, and of responsibilities, and how these inform people’s lives. As they progress, they explore life at local, national and global scales, recognising patterns, connections and differences in the ways people experience and influence the world.`,
                `Social Studies provides rich opportunities to investigate real-world issues and connect ideas across disciplines, supporting children and young people to question, reason and make informed and responsible decisions. Children and young people develop the knowledge and understanding to think critically, consider different perspectives, and explore meaningful questions about people, society and the environment. Social Studies encourages curiosity, respect and a desire to participate in and contribute to the world.`
            ],
            bigIdeas: [
                { title: 'Change: The Changing World', text: `Change shapes people, places, societies and environments over time. Understanding how and why change occurs, why some things remain the same, and how people influence and respond to change, helps make sense of the past, present and possible futures. Exploring the causes and consequences of change at local, national and global scales shows that change can happen at different paces, be experienced in different ways by people and communities, and have intended or unintended outcomes. Understanding change and continuity helps make sense of the world.` },
                { title: 'Connections: The Connected World', text: `Connections shape people, places, societies and environments across local, national and global scales. Understanding how people, places, systems and ideas are connected, and how these connections have changed over time, helps make sense of the past, present and possible futures. Exploring the social, economic, environmental and political connections between people and places shows that relationships influence opportunities and challenges, and how events and decisions are often interconnected. Understanding how connections influence people and places helps make sense of the world.` },
                { title: 'Diversity: The Diverse World', text: `Diversity shapes people, places, societies and the ideas, beliefs and values that influence them. Understanding similarities and differences within and between people, communities and environments helps make sense of the past, present and possible futures. Exploring different identities, cultures, beliefs and perspectives shows that diversity shapes people's experiences, opportunities and participation within society. Recognising the value of diversity helps make sense of the world.` },
                { title: 'Fragility: The Fragile World', text: `Fragility reflects the reality that people, places, societies, systems and environments can be disrupted, transformed or lost. Understanding how and why stability is strengthened, challenged or restored helps make sense of the past, present and possible futures. Exploring how human choices, natural processes, conflict, cooperation and sustainability influence people and places shows that stability is not always fixed. Understanding the balance between fragility and resilience helps make sense of the world.` },
                { title: 'Knowing: Making Sense of the World', text: `Knowledge is created, interpreted and used to understand the world. Curiosity, evidence, enquiry and different perspectives shape knowledge and help make sense of the past, present and possible futures. Critical thinking helps people question, interpret and apply knowledge in informed ways. Understanding how knowledge is constructed and used helps people make sense of the world.` }
            ]
        }
    ];

    // Detail levels for the Summary drill-down.
    const DEPTH_OPTIONS = [
        { id: 0, label: 'Understandings', short: 'Statements' },
        { id: 1, label: '+ Strands',      short: 'Strands' },
        { id: 2, label: '+ Know & Do',    short: 'Know & Do' }
    ];

    // Multi-select dropdown filters.
    const MULTI_FILTERS = [
        { key: 'strands',    label: 'Strands',     all: 'All strands' },
        { key: 'subStrands', label: 'Sub-strands', all: 'All sub-strands' }
    ];

    const VIEWS = [
        { id: 'summary',       label: 'Summary',              icon: 'fa-solid fa-table-cells-large' },
        { id: 'cards',         label: 'Cards',                icon: 'fa-solid fa-grip' },
        { id: 'tree',          label: 'Visual Tree',          icon: 'fa-solid fa-sitemap' },
        { id: 'understanding', label: 'Understanding Matrix', icon: 'fa-solid fa-border-all' },
        { id: 'knowdo',        label: 'Know & Do',            icon: 'fa-solid fa-list-check' }
    ];

    // Badge colours by level rank (0 = Early … 6+). Unknown levels fall back to slate.
    const LEVEL_STYLES = [
        'bg-amber-100 text-amber-800 border-amber-300',
        'bg-emerald-100 text-emerald-800 border-emerald-300',
        'bg-teal-100 text-teal-800 border-teal-300',
        'bg-cyan-100 text-cyan-800 border-cyan-300',
        'bg-blue-100 text-blue-800 border-blue-300',
        'bg-indigo-100 text-indigo-800 border-indigo-300',
        'bg-violet-100 text-violet-800 border-violet-300'
    ];
    const LEVEL_FALLBACK = 'bg-slate-100 text-slate-700 border-slate-300';

    /* =====================================================================
       Generic helpers
       ===================================================================== */
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const unique = arr => [...new Set(arr.filter(Boolean))];

    function groupBy(list, keyFn) {
        const map = new Map();
        list.forEach(x => {
            const k = keyFn(x);
            if (!map.has(k)) map.set(k, []);
            map.get(k).push(x);
        });
        return map;
    }

    /* =====================================================================
       Level helpers
       ===================================================================== */
    function levelRank(level) {
        const s = (level || '').toLowerCase();
        if (/early|foundation|reception|prep|\blevel 0\b/.test(s)) return 0;
        const ordinals = { first: 1, second: 2, third: 3, fourth: 4, fifth: 5, sixth: 6, senior: 7 };
        for (const [word, rank] of Object.entries(ordinals)) if (s.includes(word)) return rank;
        const n = s.match(/\d+/);
        return n ? parseInt(n[0], 10) : 100;
    }

    const compareLevels = (a, b) =>
        levelRank(a) - levelRank(b) || a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });

    function levelClass(level) {
        const rank = levelRank(level);
        if (rank >= 100) return LEVEL_FALLBACK;
        return LEVEL_STYLES[Math.min(rank, LEVEL_STYLES.length - 1)];
    }

    /* =====================================================================
       Text helpers (Know / Do / Notes)
       ===================================================================== */
    // Splits on full stops (followed by space/end) and line breaks; returns tidy sentences.
    function toBullets(text) {
        return String(text || '')
            .split(/\.(?=\s|$)|\n+/)
            .map(s => s.replace(/^\s*[:–—-]\s*/, '').trim())
            .filter(Boolean)
            .map(s => (/[.!?]$/.test(s) ? s : s + '.'));
    }

    // Splits a notes string into headed blocks on "Includes", "Excludes", "Notes" etc.
    function parseNotes(text) {
        if (!text) return [];
        const re = /\b(includes but not limited to|inludes but not limited to|includes|excludes|notes)\b/gi;
        const cap = w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
        const blocks = [];
        const push = (heading, body) => {
            const bullets = toBullets(body);
            if (bullets.length) blocks.push({ heading, bullets });
        };
        let last = 0, heading = '', m;
        while ((m = re.exec(text))) {
            push(heading, text.slice(last, m.index));
            heading = cap(m[1]);
            last = re.lastIndex;
        }
        push(heading, text.slice(last));
        return blocks.length ? blocks : [{ heading: '', bullets: [text.trim()] }];
    }

    // "a; b; c" -> ['a', 'b', 'c'] (trimmed, de-duplicated)
    const splitList = text => unique(String(text || '').split(';').map(t => t.trim()));

    // Free text -> paragraphs (one per line break).
    const toParagraphs = text => String(text || '').split(/\r?\n+/).map(t => t.trim()).filter(Boolean);

    // "Title https://x; https://y" -> [{ url, label, host }]. Only http(s) URLs become links.
    function parseResources(text) {
        return splitList(text).map(entry => {
            const found = entry.match(/https?:\/\/[^\s<>"]+/i) || entry.match(/\bwww\.[^\s<>"]+/i);
            if (found) {
                const raw = found[0].replace(/[.,;:!?)\]]+$/, '');
                try {
                    const url = new URL(/^https?:/i.test(raw) ? raw : 'https://' + raw);
                    if (url.protocol === 'http:' || url.protocol === 'https:') {
                        const host = url.hostname.replace(/^www\./, '');
                        const label = entry.replace(found[0], '').replace(/[()\[\]]/g, ' ').replace(/^[\s:\-–—|,]+|[\s:\-–—|,]+$/g, '').trim();
                        return { url: url.href, label: label || host, host };
                    }
                } catch (e) { /* not a valid URL: fall through to plain text */ }
            }
            return { url: '', label: entry, host: '' };
        });
    }

    // Vocabulary terms are matched to definitions case-insensitively, ignoring stray punctuation.
    const normTerm = s => String(s || '').toLowerCase().replace(/[\u2018\u2019]/g, "'").replace(/\s+/g, ' ')
        .replace(/^["'\u201c\u201d\s]+|["'\u201c\u201d.:,;\s]+$/g, '');

    // Vocabulary sheet -> { normalisedTerm: [definitions] }. Finds the term/definition columns by header
    // name, falls back to the first two columns, and copes with a sheet that has no header row.
    function buildVocab(rows) {
        const map = Object.create(null);
        if (!rows.length) return map;
        const headers = rows[0].map(normaliseHeader);
        let termIdx = headers.findIndex(h => /\bterm\b|\bword\b|vocab/.test(h));
        let defIdx = headers.findIndex(h => /defin|meaning|description|explanation/.test(h));
        let start = 1;
        if (termIdx === -1 && defIdx === -1) { termIdx = 0; defIdx = 1; start = 0; }
        if (termIdx === -1) termIdx = [0, 1].find(i => i !== defIdx);
        if (defIdx === -1) defIdx = [1, 0].find(i => i !== termIdx);
        rows.slice(start).forEach(r => {
            const term = normTerm(r[termIdx]);
            const def = (r[defIdx] || '').trim();
            if (!term || !def) return;
            (map[term] = map[term] || []);
            if (!map[term].includes(def)) map[term].push(def);
        });
        return map;
    }

    function listHtml(list) {
        if (!list || !list.length) return '<p class="italic text-slate-400">None specified.</p>';
        return '<ul class="list-disc space-y-1 pl-4 leading-relaxed text-slate-700">' +
            list.map(b => `<li>${esc(b)}</li>`).join('') + '</ul>';
    }

    function knowDoHtml(item) {
        const block = (cls, icon, label, list) =>
            `<div class="rounded-xl border p-3 ${cls}">
                <p class="mb-1 flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide"><i class="fa-solid ${icon}"></i>${label}</p>
                ${listHtml(list)}
             </div>`;
        return block('border-blue-100 bg-blue-50/60 text-blue-800', 'fa-brain', 'Know', item.knowList) +
               block('border-emerald-100 bg-emerald-50/60 text-emerald-800', 'fa-person-running', 'Do', item.doList);
    }

    /* =====================================================================
       CSV parsing
       ===================================================================== */
    function parseCsv(text) {
        const rows = [];
        let row = [''];
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
            const c = text[i], next = text[i + 1];
            if (c === '"') {
                if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                else inQuotes = !inQuotes;
            } else if (c === ',' && !inQuotes) {
                row.push('');
            } else if ((c === '\r' || c === '\n') && !inQuotes) {
                if (c === '\r' && next === '\n') i++;
                rows.push(row);
                row = [''];
            } else {
                row[row.length - 1] += c;
            }
        }
        if (row.length > 1 || row[0] !== '') rows.push(row);
        return rows;
    }

    const normaliseHeader = h => h.toLowerCase().replace(/['’`]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

    // Works out which column holds which field. Each field lists matchers in priority order.
    function mapColumns(rawHeaders) {
        const headers = rawHeaders.map(normaliseHeader);
        const find = (...tests) => {
            for (const test of tests) {
                const i = headers.findIndex(test);
                if (i !== -1) return i;
            }
            return -1;
        };
        const isSubSub = h => /sub\s*sub/.test(h);

        return {
            area:      find(h => h.includes('area'), h => /domain|subject|category/.test(h)),
            level:     find(h => /level|grade|stage/.test(h)),
            strand:    find(h => h.includes('strand') && !h.includes('sub')),
            subStrand: find(h => /sub\s*strand/.test(h) && !isSubSub(h)),
            subSub:    find(h => isSubSub(h) || /elaboration|focus/.test(h)),
            statement: find(h => /statement|understanding|overarching/.test(h)),
            know:      find(h => h === 'know' || h === 'knows', h => h.includes('know'), h => h.includes('content')),
            // Do statements come from the "Dos" field only.
            do:        find(h => h === 'dos', h => h === 'do', h => /^dos?\b/.test(h)),
            notes:     find(h => /note|comment|remark/.test(h)),
            vocab:     find(h => /vocab/.test(h)),
            deepDive:  find(h => /deep\s*dive/.test(h)),
            resources: find(h => /resource/.test(h))
        };
    }

    function buildItems(rows) {
        const warnings = [];
        if (rows.length < 2) return { items: [], warnings };

        const cols = mapColumns(rows[0]);
        // Positional fallbacks for the core columns if a header could not be matched.
        const fallback = { area: 0, level: 1, strand: 2, subStrand: 3, statement: 4, know: 5 };
        Object.entries(fallback).forEach(([k, i]) => { if (cols[k] === -1) cols[k] = i; });

        if (cols.do === -1) warnings.push('No "Dos" column was found in the sheet, so Do statements cannot be shown. Check the column header.');

        const items = rows.slice(1)
            .filter(r => r.some(c => c.trim()))
            .map((r, i) => {
                const get = idx => (idx >= 0 ? (r[idx] || '').trim() : '');
                const item = {
                    id: i,
                    area: get(cols.area) || 'General Area',
                    level: get(cols.level) || 'General Level',
                    strand: get(cols.strand) || 'General Strand',
                    subStrand: get(cols.subStrand) || 'General Sub-Strand',
                    subSubStrand: get(cols.subSub),
                    statement: get(cols.statement),
                    know: get(cols.know),
                    do: get(cols.do),
                    notes: get(cols.notes),
                    vocab: get(cols.vocab),
                    deepDive: get(cols.deepDive),
                    resourcesRaw: get(cols.resources)
                };
                item.knowList = toBullets(item.know);
                item.doList = toBullets(item.do);
                item.hasNotes = item.notes.length > 0;
                item.noteBlocks = parseNotes(item.notes);
                item.vocabTerms = splitList(item.vocab);
                item.deepParas = toParagraphs(item.deepDive);
                item.resources = parseResources(item.resourcesRaw);
                item.hasMore = item.vocabTerms.length > 0 || item.deepParas.length > 0 || item.resources.length > 0;
                item.searchText = [item.area, item.level, item.strand, item.subStrand, item.subSubStrand,
                                   item.statement, item.know, item.do, item.notes, item.vocab, item.deepDive,
                                   item.resources.map(r => r.label).join(' ')].join(' ').toLowerCase();
                return item;
            });

        return { items, warnings };
    }

    /* =====================================================================
       Derived views (pure functions of the filtered items)
       ===================================================================== */
    const compareItems = (a, b) =>
        a.area.localeCompare(b.area) || compareLevels(a.level, b.level) || a.id - b.id;

    // Summary cells hold three levels of detail: statements -> strands -> strands with Know & Do.
    function buildSummary(items) {
        const levels = unique(items.map(i => i.level)).sort(compareLevels);
        const stmt = i => i.statement || 'No understanding statement.';
        const rows = [...groupBy(items, i => i.area)].map(([area, list]) => {
            const cells = {};
            levels.forEach(lv => {
                const inCell = list.filter(i => i.level === lv);
                cells[lv] = {
                    statements: unique(inCell.map(stmt)),
                    strands: [...groupBy(inCell, i => i.strand)]
                        .sort((a, b) => a[0].localeCompare(b[0]))
                        .map(([strand, strandItems]) => ({
                            strand,
                            groups: [...groupBy(strandItems, stmt)].map(([statement, groupItems]) => ({ statement, items: groupItems }))
                        }))
                };
            });
            return { area, cells };
        });
        return { levels, rows };
    }

    function buildMatrix(items) {
        return [...groupBy(items, i => i.area)].map(([area, list]) => {
            const cells = {}, itemCells = {};
            groupBy(list, i => i.level + '||' + i.strand).forEach((cellItems, key) => {
                itemCells[key] = cellItems;
                cells[key] = [...groupBy(cellItems, i => i.statement || 'No understanding statement.')]
                    .map(([statement, groupItems]) => ({ statement, items: groupItems }));
            });
            return {
                area,
                count: list.length,
                levels: unique(list.map(i => i.level)).sort(compareLevels),
                strands: unique(list.map(i => i.strand)).sort(),
                cells,
                itemCells
            };
        });
    }

    // Level -> area -> strand -> sub-strand. A strand carries its understanding statement(s);
    // each leaf is one sub-strand record. If a strand has several statements, leaves point at theirs (U1, U2…).
    function buildTree(items) {
        const levels = unique(items.map(i => i.level)).sort(compareLevels);
        return levels.map(level => {
            const inLevel = items.filter(i => i.level === level);
            return {
                key: 'L:' + level,
                level,
                count: inLevel.length,
                areas: [...groupBy(inLevel, i => i.area)].map(([area, inArea]) => ({
                    key: 'A:' + level + '|' + area,
                    area,
                    count: inArea.length,
                    strands: [...groupBy(inArea, i => i.strand)]
                        .sort((a, b) => a[0].localeCompare(b[0]))
                        .map(([strand, list]) => {
                            const statements = unique(list.map(i => i.statement));
                            return {
                                key: 'S:' + level + '|' + area + '|' + strand,
                                strand,
                                statements,
                                leaves: list.map(item => ({
                                    item,
                                    ref: statements.length > 1 && item.statement ? statements.indexOf(item.statement) + 1 : 0
                                }))
                            };
                        })
                }))
            };
        });
    }

    /* =====================================================================
       Alpine app
       ===================================================================== */
    function curriculumApp() {
        return {
            // ---- state
            views: VIEWS,
            view: 'cards',
            loading: true,
            error: null,
            warnings: [],
            items: [],
            filters: { search: '', area: '', levels: [], strands: [], subStrands: [] },
            filtersOpen: window.innerWidth >= 768,
            options: { levels: [], strands: [], subStrands: [] },
            levelsAsRows: false,
            kdLevelsAsRows: false,
            depthOptions: DEPTH_OPTIONS,
            multiFilters: MULTI_FILTERS,
            summaryDepth: 0,
            cellDepths: {},
            page: 1,
            printing: false,
            detail: null,
            notesItem: null,
            moreItem: null,
            vocab: Object.create(null),
            vocabLoaded: false,
            vocabFailed: false,
            treeOpen: {},

            // ---- derived (rebuilt by apply())
            filtered: [],
            summary: { levels: [], rows: [] },
            matrix: [],
            tree: [],

            // ---- template helpers
            levelClass, listHtml, knowDoHtml, IDEA_COLOURS,

            // ---- loading
            async init() {
                this.loading = true;
                this.error = null;
                this.loadVocab();   // runs alongside the main load; never blocks it
                try {
                    const res = await fetch(CSV_URL, { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP status ' + res.status);
                    const { items, warnings } = buildItems(parseCsv(await res.text()));
                    this.items = items;
                    this.warnings = warnings;
                    this.apply();
                } catch (err) {
                    console.error('Fetch error:', err);
                    const hint = location.protocol === 'file:'
                        ? ' This page is open via file:// – serve it over http(s) (e.g. GitHub Pages) and try again.'
                        : ' Check the sheet is still published to the web as CSV and that nothing is blocking docs.google.com.';
                    this.error = 'Could not load curriculum data (' + (err && err.message ? err.message : 'network or CORS error') + ').' + hint;
                } finally {
                    this.loading = false;
                }
            },

            // ---- vocabulary definitions (second sheet; failure only means terms show without definitions)
            async loadVocab() {
                this.vocabLoaded = false;
                this.vocabFailed = false;
                try {
                    const res = await fetch(VOCAB_URL, { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP status ' + res.status);
                    this.vocab = buildVocab(parseCsv(await res.text()));
                    this.vocabLoaded = true;
                } catch (err) {
                    console.warn('Could not load vocabulary definitions:', err);
                    this.vocabFailed = true;
                }
            },
            vocabEntries(item) {
                return item.vocabTerms.map(term => ({ term, defs: this.vocab[normTerm(term)] || [] }));
            },

            // ---- filtering
            get allAreas() { return unique(this.items.map(i => i.area)).sort(); },

            get activeFilterCount() {
                const f = this.filters;
                return (f.area ? 1 : 0) + f.levels.length + f.strands.length + f.subStrands.length;
            },

            get purpose() {
                const area = this.filters.area;
                return area ? PURPOSE_STATEMENTS.find(p => p.match.test(area)) || null : null;
            },

            // Recomputes the cascading filter options, the filtered list and every derived view.
            apply() {
                const f = this.filters;
                const prune = (selected, available) => selected.filter(v => available.includes(v));

                const inArea = this.items.filter(i => !f.area || i.area === f.area);
                this.options.levels = unique(inArea.map(i => i.level)).sort(compareLevels);
                f.levels = prune(f.levels, this.options.levels);

                const inLevel = inArea.filter(i => !f.levels.length || f.levels.includes(i.level));
                this.options.strands = unique(inLevel.map(i => i.strand)).sort();
                f.strands = prune(f.strands, this.options.strands);

                const inStrand = inLevel.filter(i => !f.strands.length || f.strands.includes(i.strand));
                this.options.subStrands = unique(inStrand.map(i => i.subStrand)).sort();
                f.subStrands = prune(f.subStrands, this.options.subStrands);

                const q = f.search.trim().toLowerCase();
                this.filtered = inStrand
                    .filter(i => (!f.subStrands.length || f.subStrands.includes(i.subStrand)) && (!q || i.searchText.includes(q)))
                    .sort(compareItems);

                this.summary = buildSummary(this.filtered);
                this.matrix = buildMatrix(this.filtered);
                this.tree = buildTree(this.filtered);
                this.page = 1;
            },

            setSearch(value) { this.filters.search = value; this.apply(); },
            toggleFilter(key, value) {
                const list = this.filters[key];
                const i = list.indexOf(value);
                i > -1 ? list.splice(i, 1) : list.push(value);
                this.apply();
            },
            clearFilter(key) { this.filters[key] = []; this.apply(); },
            selectOptions(key, values) {
                this.filters[key] = unique([...this.filters[key], ...values]);
                this.apply();
            },
            optionsMatching(key, q) {
                const needle = (q || '').trim().toLowerCase();
                return this.options[key].filter(o => !needle || o.toLowerCase().includes(needle));
            },
            multiLabel(f) {
                const sel = this.filters[f.key];
                if (!sel.length) return f.all;
                return sel.length === 1 ? sel[0] : sel.length + ' selected';
            },
            resetFilters() {
                this.filters = { search: '', area: '', levels: [], strands: [], subStrands: [] };
                this.apply();
            },

            // ---- cards pagination
            get totalPages() { return Math.max(1, Math.ceil(this.filtered.length / PAGE_SIZE)); },
            get pageGroups() {
                const list = this.printing
                    ? this.filtered
                    : this.filtered.slice((this.page - 1) * PAGE_SIZE, this.page * PAGE_SIZE);
                return [...groupBy(list, i => i.area)].map(([area, items]) => ({ area, items }));
            },
            goToPage(n) {
                this.page = Math.min(this.totalPages, Math.max(1, n));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            // ---- understanding matrix
            matrixCell(m, row, col) {
                const [level, strand] = this.levelsAsRows ? [row, col] : [col, row];
                return m.cells[level + '||' + strand] || [];
            },

            // ---- know & do matrix
            kdItems(m, row, col) {
                const [level, strand] = this.kdLevelsAsRows ? [row, col] : [col, row];
                return m.itemCells[level + '||' + strand] || [];
            },

            // ---- summary drill-down (global level, overridable per cell)
            cellKey(row, level) { return row.area + '||' + level; },
            depthFor(key) { return key in this.cellDepths ? this.cellDepths[key] : this.summaryDepth; },
            setCellDepth(key, depth) { this.cellDepths = { ...this.cellDepths, [key]: depth }; },
            setAllDepths(depth) { this.summaryDepth = depth; this.cellDepths = {}; },

            // ---- modals
            openDetail(item) { this.detail = item; },
            openNotes(item) { this.notesItem = item; },
            openMore(item) { this.moreItem = item; },
            closeModals() {
                // Close the top-most modal first (notes sit above details).
                if (this.moreItem) this.moreItem = null;
                else if (this.notesItem) this.notesItem = null;
                else this.detail = null;
            },

            // ---- visual tree (levels start open; everything else starts collapsed)
            isOpen(key) {
                if (this.printing) return true;
                return key in this.treeOpen ? this.treeOpen[key] : key.startsWith('L:');
            },
            toggleNode(key) { this.treeOpen = { ...this.treeOpen, [key]: !this.isOpen(key) }; },
            setTree(open) {
                const state = {};
                this.tree.forEach(lv => {
                    state[lv.key] = open;
                    lv.areas.forEach(ar => {
                        state[ar.key] = open;
                        ar.strands.forEach(st => { state[st.key] = open; });
                    });
                });
                this.treeOpen = state;
            },
            expandTree() { this.setTree(true); },
            collapseTree() { this.setTree(false); },

            // ---- export
            exportPdf() {
                this.printing = true;
                this.$nextTick(() => { window.print(); this.printing = false; });
            }
        };
    }
    </script>
