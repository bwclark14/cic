<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Learning Planner</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>

    <style type="text/tailwindcss">
        @layer components {
            .badge  { @apply inline-flex items-center rounded-md border px-2 py-0.5 text-[11px] font-bold uppercase tracking-wide; }
            .chip   { @apply rounded-full border px-3 py-1.5 text-xs font-medium transition text-left; }
            .btn    { @apply inline-flex items-center justify-center gap-1.5 rounded-xl border px-3 py-2 text-sm font-semibold transition; }
            .btn-note { @apply inline-flex items-center gap-1 rounded-lg border border-amber-200 bg-amber-50 px-2 py-1 text-xs font-semibold text-amber-800 transition hover:bg-amber-100; }
            .btn-more { @apply inline-flex items-center gap-1 rounded-lg border border-indigo-200 bg-indigo-50 px-2 py-1 text-xs font-semibold text-indigo-700 transition hover:bg-indigo-100; }
            .panel  { @apply rounded-2xl border border-slate-200 bg-white shadow-sm; }
            .eyebrow { @apply text-[11px] font-bold uppercase tracking-wider text-slate-400; }
            .field  { @apply w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-200; }
            .label  { @apply mb-1 block text-xs font-semibold text-slate-600; }
            .menu   { @apply absolute right-0 z-40 mt-1 w-60 overflow-hidden rounded-xl border border-slate-200 bg-white py-1 shadow-lg; }
            .menu-item { @apply flex w-full items-center gap-2.5 px-3.5 py-2.5 text-left text-sm font-medium text-slate-700 hover:bg-slate-50; }
            .area-bar { @apply flex items-center justify-between gap-3 rounded-2xl bg-gradient-to-r from-indigo-900 to-violet-900 px-4 py-3 text-white; }
        }
        /* ---- Mind map ---- */
        .mm-scroll { overflow-x: auto; }
        .mm { position: relative; display: block; min-width: 100%; padding: 20px 16px; --mm-line: #cbd5e1; }
        .mm.is-radial { display: inline-block; min-width: 100%; }
        .mm-svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
        .mm-svg path { fill: none; stroke-linecap: round; }
        .mm-grid { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 18px; }
        .mm.is-radial .mm-grid { flex-direction: row; align-items: center; justify-content: center; gap: 28px; }
        .mm-side { display: flex; flex-direction: column; gap: 22px; }
        .mm.is-radial .mm-left .mm-group { flex-direction: row-reverse; }
        .mm.is-radial .mm-left .mm-cluster { flex-direction: row-reverse; }
        .mm.is-radial .mm-left .mm-leaves { align-items: flex-end; text-align: right; }
        .mm-group { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
        .mm.is-radial .mm-group { flex-direction: row; align-items: center; gap: 24px; }
        .mm-clusters { display: flex; flex-direction: column; gap: 12px; }
        .mm-cluster { display: flex; flex-direction: column; gap: 6px; }
        .mm.is-radial .mm-cluster { flex-direction: row; align-items: center; gap: 22px; }
        .mm-leaves { display: flex; flex-direction: column; gap: 6px; }
        .mm:not(.is-radial) .mm-clusters, .mm:not(.is-radial) .mm-leaves { margin-left: 14px; padding-left: 12px; border-left: 2px solid var(--c, #cbd5e1); }
        .mm-core { border-radius: 9999px; padding: 18px 22px; max-width: 220px; text-align: center; font-weight: 800; font-size: 14px; line-height: 1.25; color: #fff; background: linear-gradient(135deg, #312e81, #6d28d9); box-shadow: 0 6px 18px rgba(79,70,229,.3); }
        .mm:not(.is-radial) .mm-core { max-width: none; border-radius: 18px; }
        .mm-core small { display: block; margin-top: 4px; font-size: 11px; font-weight: 500; opacity: .8; }
        .mm-hub { border-radius: 9999px; padding: 8px 16px; font-size: 13px; font-weight: 800; color: #fff; background: var(--c); text-align: center; white-space: nowrap; align-self: flex-start; }
        .mm.is-radial .mm-hub { align-self: center; }
        .mm-hub small { font-weight: 600; opacity: .85; margin-left: 4px; }
        .mm-strand { border-radius: 10px; padding: 6px 10px; font-size: 11.5px; font-weight: 700; line-height: 1.25; color: var(--c); background: var(--bg); border: 1.5px solid var(--c); max-width: 150px; align-self: flex-start; }
        .mm.is-radial .mm-strand { align-self: center; flex: none; width: 118px; max-width: 118px; }
        .mm-strand small { display: block; font-weight: 500; opacity: .75; }
        .mm-leaf { border-radius: 8px; padding: 5px 9px; font-size: 11.5px; line-height: 1.35; color: #1e293b; background: #fff; border: 1px solid var(--c); border-left-width: 4px; width: 100%; max-width: 300px; }
        .mm.is-radial .mm-leaf { width: 190px; }
        .mm-leaf .lv { display: inline-block; margin-right: 5px; border-radius: 4px; padding: 0 4px; font-size: 9.5px; font-weight: 700; color: var(--c); background: var(--bg); }
        .mm:not(.is-radial) .mm-core { order: -1; }
        .mm:not(.is-radial) .mm-side { margin-left: 14px; padding-left: 12px; border-left: 2px solid #c7d2fe; }
        .mm-u { --c: #b45309; --bg: #fffbeb; }
        .mm-k { --c: #0369a1; --bg: #f0f9ff; }
        .mm-d { --c: #047857; --bg: #ecfdf5; }
    </style>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] > summary .chev { transform: rotate(90deg); }
        .cov-table { table-layout: fixed; width: 100%; border-collapse: collapse; font-size: 12px; }
        .cov-table th, .cov-table td { border: 1px solid #e2e8f0; padding: .4rem .35rem; text-align: center; vertical-align: middle; overflow-wrap: anywhere; }
        .cov-table th:first-child, .cov-table td:first-child { text-align: left; width: 28%; padding-left: .6rem; }
        @media (max-width: 640px) { .cov-table { font-size: 10.5px; } .cov-table th:first-child, .cov-table td:first-child { width: 32%; } }

        /* Printable plan: hidden on screen, the only thing shown when printing */
        #printDoc { display: none; }
        @media print {
            body > *:not(#printDoc) { display: none !important; }
            #printDoc { display: block !important; }
            body { background: #fff !important; }
            @page { margin: 14mm; }
        }
    </style>
</head>

<body class="bg-slate-50 font-sans text-sm text-slate-800 antialiased">

    <!-- ============ Header ============ -->
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur">
        <div class="mx-auto max-w-[1400px] space-y-3 px-4 py-3 sm:px-6">
            <div class="flex items-center justify-between gap-3">
                <div class="flex min-w-0 items-center gap-3">
                    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 text-white shadow-md shadow-indigo-200">
                        <i class="fa-solid fa-clipboard-list"></i>
                    </div>
                    <div class="min-w-0">
                        <h1 class="truncate text-base font-bold leading-tight text-slate-900">Teacher Learning Planner</h1>
                        <p class="truncate text-xs text-slate-500">Plan from the Know, Do and Understand framework</p>
                    </div>
                </div>
                <a href="index.html" class="btn shrink-0 border-slate-200 bg-white text-slate-700 hover:bg-slate-50" title="Back to the Curriculum Explorer">
                    <i class="fa-solid fa-graduation-cap"></i><span class="hidden sm:inline">Curriculum Explorer</span>
                </a>
            </div>

            <!-- Plan toolbar -->
            <div class="flex flex-wrap items-center gap-2" id="toolbar">
                <label class="sr-only" for="planSelect">Current plan</label>
                <select id="planSelect" data-act="switch-plan"
                        class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-white px-3 py-2 font-semibold focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-200 sm:max-w-sm"></select>
                <button data-act="new-plan" class="btn border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100"><i class="fa-solid fa-plus"></i><span>New</span></button>

                <div class="relative" data-menu-root>
                    <button data-act="menu" data-menu="manage" class="btn border-slate-200 bg-white text-slate-700 hover:bg-slate-50" aria-haspopup="true">
                        <i class="fa-solid fa-ellipsis"></i><span class="hidden sm:inline">Manage</span>
                    </button>
                    <div id="menuManage" class="menu hidden">
                        <button data-act="duplicate-plan" class="menu-item"><i class="fa-regular fa-copy w-4 text-slate-400"></i>Duplicate plan</button>
                        <button data-act="import" class="menu-item"><i class="fa-solid fa-file-import w-4 text-slate-400"></i>Import plan (.json)</button>
                        <button data-act="delete-plan" class="menu-item text-red-600"><i class="fa-regular fa-trash-can w-4"></i>Delete plan</button>
                    </div>
                </div>

                <div class="relative ml-auto" data-menu-root>
                    <button data-act="menu" data-menu="export" class="btn border-indigo-600 bg-indigo-600 text-white hover:bg-indigo-700" aria-haspopup="true">
                        <i class="fa-solid fa-file-export"></i><span>Export</span><i class="fa-solid fa-chevron-down text-[10px]"></i>
                    </button>
                    <div id="menuExport" class="menu hidden">
                        <button data-act="export-print" class="menu-item"><i class="fa-solid fa-file-pdf w-4 text-red-500"></i>Print / save as PDF</button>
                        <button data-act="export-word" class="menu-item"><i class="fa-solid fa-file-word w-4 text-blue-600"></i>Word document (.doc)</button>
                        <button data-act="export-json" class="menu-item"><i class="fa-solid fa-file-code w-4 text-slate-500"></i>Plan file (.json) to back up or share</button>
                    </div>
                </div>
                <input type="file" id="importFile" accept=".json,application/json" class="hidden">
            </div>

            <nav class="no-scrollbar -mx-4 flex gap-1.5 overflow-x-auto px-4 sm:mx-0 sm:px-0" aria-label="Planner sections">
                <button data-act="tab" data-tab="browse" class="tab flex shrink-0 items-center gap-2 rounded-xl px-3.5 py-2 text-sm font-semibold transition"><i class="fa-solid fa-magnifying-glass"></i>Browse curriculum</button>
                <button data-act="tab" data-tab="plan" class="tab flex shrink-0 items-center gap-2 rounded-xl px-3.5 py-2 text-sm font-semibold transition"><i class="fa-solid fa-pen-to-square"></i>My plan <span id="cntPlan" class="rounded-full bg-white/70 px-1.5 text-[11px] text-indigo-700"></span></button>
                <button data-act="tab" data-tab="coverage" class="tab flex shrink-0 items-center gap-2 rounded-xl px-3.5 py-2 text-sm font-semibold transition"><i class="fa-solid fa-chart-simple"></i>Coverage</button>
                <button data-act="tab" data-tab="mindmap" class="tab flex shrink-0 items-center gap-2 rounded-xl px-3.5 py-2 text-sm font-semibold transition"><i class="fa-solid fa-diagram-project"></i>Mind map</button>
            </nav>
        </div>
    </header>

    <div id="storageWarning" class="hidden border-b border-amber-200 bg-amber-50 px-4 py-2 text-center text-xs text-amber-900">
        Plans can't be saved in this browser (private window or blocked storage). Use <b>Export → Plan file</b> to keep your work.
    </div>

    <main id="app" class="mx-auto w-full max-w-[1400px] space-y-5 px-4 py-5 sm:px-6"></main>

    <div id="modalRoot"></div>
    <div id="printDoc" class="plan-doc"></div>
    <div id="toast" class="pointer-events-none fixed inset-x-0 bottom-5 z-[80] flex justify-center px-4 opacity-0 transition-opacity"></div>

    <script src="cic-data.js"></script>
    <script>
    (() => {
    'use strict';

    /* =====================================================================
       Constants
       ===================================================================== */
    const STORE_KEY = 'cic-planner-v1';
    const PAGE = 30;
    const STATUSES = ['Planned', 'Taught', 'Assessed'];
    const STATUS_CLASS = { Planned: 'bg-slate-100 text-slate-700 border-slate-300', Taught: 'bg-blue-100 text-blue-800 border-blue-300', Assessed: 'bg-emerald-100 text-emerald-800 border-emerald-300' };

    // Plan-level free-text fields: [key, label, placeholder, rows]
    const PLAN_FIELDS = [
        ['intentions',          'Learning intentions / big question', 'What will learners understand, know and be able to do by the end?', 3],
        ['activities',          'Teaching and learning activities',   'Key activities, sequence of lessons, grouping…', 5],
        ['resources',           'Resources',                          'Texts, materials, digital tools, people…', 3],
        ['differentiation',     'Differentiation and inclusion',      'How will you support and extend learners?', 3],
        ['assessmentOverview',  'Assessment overview',                'Formative checks, summative task, feedback approach, success criteria…', 4],
        ['reflection',          'Reflection and next steps',          'What worked? What will you change?', 3]
    ];

    /* =====================================================================
       State
       ===================================================================== */
    const state = {
        loading: true, error: null,
        items: [], byId: new Map(), byKey: new Map(),
        vocab: Object.create(null), vocabLoaded: false, vocabFailed: false,
        tab: 'browse',
        filters: { area: '', levels: [], strands: [], search: '' },
        strandMenu: false, limit: PAGE, detailsOpen: true,
        plans: [], currentId: null,
        openRecs: new Set(),
        covAll: false, mmDetail: 'full',
        menu: null
    };
    window.__planner = state;   // handy for debugging in the console

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
    const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));

    /* =====================================================================
       Plans: model, storage
       ===================================================================== */
    let storageOK = true;
    let saveTimer = null;

    const newId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    function newPlan(title = 'Untitled plan') {
        const now = Date.now();
        const p = { id: newId(), title, teacher: '', classGroup: '', timeframe: '', created: now, updated: now, selections: {} };
        PLAN_FIELDS.forEach(([k]) => { p[k] = ''; });
        return p;
    }

    const normList = a => (Array.isArray(a) ? a : []).filter(x => x && typeof x === 'object')
        .map(x => ({ text: str(x.text), on: !!x.on })).filter(x => x.text);

    // Coerces anything loaded from storage or an imported file into a safe plan.
    function normalisePlan(raw) {
        raw = raw && typeof raw === 'object' ? raw : {};
        const p = newPlan(str(raw.title).slice(0, 200) || 'Untitled plan');
        ['teacher', 'classGroup', 'timeframe', ...PLAN_FIELDS.map(f => f[0])].forEach(k => { p[k] = str(raw[k]); });
        p.created = Number(raw.created) || p.created;
        p.updated = Number(raw.updated) || p.updated;
        const sel = raw.selections && typeof raw.selections === 'object' ? raw.selections : {};
        Object.entries(sel).forEach(([k, v]) => {
            if (!v || typeof v !== 'object') return;
            p.selections[k] = {
                key: k, area: str(v.area), level: str(v.level), strand: str(v.strand),
                subStrand: str(v.subStrand), subSubStrand: str(v.subSubStrand), statement: str(v.statement),
                knows: normList(v.knows), dos: normList(v.dos),
                status: STATUSES.includes(v.status) ? v.status : 'Planned',
                planning: str(v.planning), assessment: str(v.assessment), evidence: str(v.evidence),
                added: Number(v.added) || Date.now()
            };
        });
        return p;
    }

    function loadStore() {
        try {
            const raw = localStorage.getItem(STORE_KEY);
            if (raw) {
                const d = JSON.parse(raw);
                state.plans = (Array.isArray(d.plans) ? d.plans : []).map(p => {
                    const n = normalisePlan(p);
                    if (p && p.id) n.id = str(p.id);
                    return n;
                });
                state.currentId = str(d.currentId);
            }
        } catch (e) { storageOK = false; }
        if (!state.plans.length) state.plans = [newPlan()];
        if (!state.plans.some(p => p.id === state.currentId)) state.currentId = state.plans[0].id;
        $('#storageWarning').classList.toggle('hidden', storageOK);
    }

    function saveNow() {
        clearTimeout(saveTimer); saveTimer = null;
        try {
            localStorage.setItem(STORE_KEY, JSON.stringify({ plans: state.plans, currentId: state.currentId }));
            storageOK = true;
        } catch (e) { storageOK = false; }
        $('#storageWarning').classList.toggle('hidden', storageOK);
    }
    const scheduleSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 350); };
    window.addEventListener('pagehide', () => { if (saveTimer) saveNow(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) saveNow(); });

    const plan = () => state.plans.find(p => p.id === state.currentId);
    const touch = () => { plan().updated = Date.now(); scheduleSave(); };

    /* =====================================================================
       Selections (the Know / Do statements pulled into a plan)
       ===================================================================== */
    const onCount = s => s.knows.filter(x => x.on).length + s.dos.filter(x => x.on).length;
    const totalCount = i => i.knowList.length + i.doList.length;
    const hasText = s => !!(s.planning.trim() || s.assessment.trim() || s.evidence.trim());

    function ensureSel(item) {
        const p = plan(), k = itemKey(item);
        if (!p.selections[k]) {
            p.selections[k] = {
                key: k, area: item.area, level: item.level, strand: item.strand,
                subStrand: item.subStrand, subSubStrand: item.subSubStrand, statement: item.statement,
                knows: item.knowList.map(t => ({ text: t, on: false })),
                dos: item.doList.map(t => ({ text: t, on: false })),
                status: 'Planned', planning: '', assessment: '', evidence: '', added: Date.now()
            };
        }
        return p.selections[k];
    }

    // Finds a statement by text (so plans keep working if the sheet is re-ordered), adding it if missing.
    function setStatement(sel, kind, text, on) {
        let entry = sel[kind].find(x => x.text === text);
        if (!entry) { entry = { text, on: false }; sel[kind].push(entry); }
        entry.on = on;
    }

    function dropIfEmpty(sel) {
        if (onCount(sel) === 0 && !hasText(sel)) delete plan().selections[sel.key];
    }

    const selectionsSorted = p => Object.values(p.selections).sort((a, b) =>
        a.area.localeCompare(b.area) || compareLevels(a.level, b.level) || a.strand.localeCompare(b.strand) ||
        a.subStrand.localeCompare(b.subStrand));

    /* =====================================================================
       Coverage
       ===================================================================== */
    function computeCoverage(p, wholeCurriculum) {
        const touched = Object.values(p.selections).filter(s => onCount(s) > 0);
        const areasUsed = new Set(touched.map(s => s.area));
        const scope = state.items.filter(i => wholeCurriculum || areasUsed.has(i.area));
        const blank = () => ({ records: 0, touched: 0, statements: 0, planned: 0 });
        const add = (t, rec, tch, st, pl) => { t.records += rec; t.touched += tch; t.statements += st; t.planned += pl; };

        const totals = blank();
        const areas = new Map();
        const seen = new Set();
        scope.forEach(i => {
            const k = itemKey(i);
            if (seen.has(k)) return;          // identical duplicate rows count once
            seen.add(k);
            const total = totalCount(i);
            const sel = p.selections[k];
            const planned = sel ? Math.min(onCount(sel), total) : 0;
            const t = planned > 0 ? 1 : 0;
            if (!areas.has(i.area)) areas.set(i.area, { area: i.area, ...blank(), levels: new Set(), strands: new Map() });
            const A = areas.get(i.area);
            if (!A.strands.has(i.strand)) A.strands.set(i.strand, { strand: i.strand, ...blank(), cells: new Map() });
            const S = A.strands.get(i.strand);
            if (!S.cells.has(i.level)) S.cells.set(i.level, blank());
            A.levels.add(i.level);
            add(totals, 1, t, total, planned); add(A, 1, t, total, planned); add(S, 1, t, total, planned);
            add(S.cells.get(i.level), 1, t, total, planned);
        });

        const orphans = touched.filter(s => !state.byKey.has(s.key)).length;
        return {
            totals, orphans,
            areas: [...areas.values()].sort((a, b) => a.area.localeCompare(b.area)).map(A => ({
                ...A,
                levels: [...A.levels].sort(compareLevels),
                strands: [...A.strands.values()].sort((a, b) => a.strand.localeCompare(b.strand))
            }))
        };
    }

    const pct = (n, d) => (d ? Math.round((n / d) * 100) : 0);

    // Compact level label for narrow screens: 'Second' -> '2nd', unknown names -> first three letters.
    const SHORT_LEVELS = { early: 'Ear', first: '1st', second: '2nd', third: '3rd', fourth: '4th', fifth: '5th', sixth: '6th', senior: 'Sen' };
    const levelShort = l => { const k = str(l).trim().toLowerCase().split(/\s+/)[0]; return SHORT_LEVELS[k] || str(l).trim().slice(0, 3); };

    /* =====================================================================
       Small UI helpers
       ===================================================================== */
    function toast(msg) {
        const el = $('#toast');
        el.innerHTML = `<div class="rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-medium text-white shadow-lg">${esc(msg)}</div>`;
        el.style.opacity = '1';
        clearTimeout(toast.t);
        toast.t = setTimeout(() => { el.style.opacity = '0'; }, 2600);
    }

    function download(filename, mime, content) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    const slug = s => (str(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'learning-plan').slice(0, 60);

    const progressBar = (n, d, colour = 'bg-indigo-500') =>
        `<div class="h-2 w-full overflow-hidden rounded-full bg-slate-200"><div class="h-full rounded-full ${colour}" style="width:${pct(n, d)}%"></div></div>`;

    const para = t => toParagraphs(t).map(x => `<p>${esc(x)}</p>`).join('');

    /* =====================================================================
       Header (plan switcher, tabs, menus)
       ===================================================================== */
    function renderHeader() {
        $('#planSelect').innerHTML = state.plans.map(p =>
            `<option value="${esc(p.id)}"${p.id === state.currentId ? ' selected' : ''}>${esc(p.title || 'Untitled plan')}</option>`).join('');
        $$('.tab').forEach(b => {
            const on = b.dataset.tab === state.tab;
            b.className = 'tab flex shrink-0 items-center gap-2 rounded-xl px-3.5 py-2 text-sm font-semibold transition ' +
                (on ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200');
        });
        const n = Object.values(plan().selections).filter(s => onCount(s) > 0).length;
        $('#cntPlan').textContent = n || '';
        $('#cntPlan').style.display = n ? '' : 'none';
        $('#menuManage').classList.toggle('hidden', state.menu !== 'manage');
        $('#menuExport').classList.toggle('hidden', state.menu !== 'export');
    }

    /* =====================================================================
       Browse tab
       ===================================================================== */
    function browseOptions() {
        const f = state.filters;
        const inArea = state.items.filter(i => !f.area || i.area === f.area);
        const levels = unique(inArea.map(i => i.level)).sort(compareLevels);
        const inLevel = inArea.filter(i => !f.levels.length || f.levels.includes(i.level));
        const strands = unique(inLevel.map(i => i.strand)).sort();
        return { levels, strands };
    }

    function pruneFilters() {
        const { levels, strands } = browseOptions();
        state.filters.levels = state.filters.levels.filter(l => levels.includes(l));
        const { strands: s2 } = browseOptions();
        state.filters.strands = state.filters.strands.filter(s => s2.includes(s));
    }

    function browseItems() {
        const f = state.filters, q = f.search.trim().toLowerCase();
        return state.items.filter(i =>
            (!f.area || i.area === f.area) && (!f.levels.length || f.levels.includes(i.level)) &&
            (!f.strands.length || f.strands.includes(i.strand)) && (!q || i.searchText.includes(q)))
            .sort((a, b) => a.area.localeCompare(b.area) || a.strand.localeCompare(b.strand) ||
                compareLevels(a.level, b.level) || a.id - b.id);
    }

    function statementRows(item, kind, sel) {
        const list = kind === 'knows' ? item.knowList : item.doList;
        if (!list.length) return '<p class="text-xs italic text-slate-400">None specified.</p>';
        return list.map((text, idx) => {
            const on = !!(sel && sel[kind].some(x => x.text === text && x.on));
            return `<label class="flex cursor-pointer items-start gap-2.5 rounded-lg px-1.5 py-1 hover:bg-white/70">
                <input type="checkbox" class="mt-0.5 h-4 w-4 shrink-0 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                       data-act="toggle" data-id="${item.id}" data-kind="${kind}" data-idx="${idx}"${on ? ' checked' : ''}>
                <span class="leading-snug">${esc(text)}</span></label>`;
        }).join('');
    }

    function cardHtml(item) {
        const sel = plan().selections[itemKey(item)];
        const n = sel ? Math.min(onCount(sel), totalCount(item)) : 0;
        const total = totalCount(item);
        const extra = [
            item.hasNotes ? `<button data-act="notes" data-id="${item.id}" class="btn-note"><i class="fa-solid fa-note-sticky"></i>Notes</button>` : '',
            item.hasMore ? `<button data-act="more" data-id="${item.id}" class="btn-more"><i class="fa-solid fa-circle-info"></i>More info</button>` : ''
        ].join('');
        return `<article data-card="${item.id}" class="panel space-y-3 p-4 ${n ? 'ring-2 ring-indigo-300' : ''}">
            <div class="flex flex-wrap items-start justify-between gap-2">
                <div class="min-w-0 space-y-0.5">
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="badge ${levelClass(item.level)}">${esc(item.level)}</span>
                        <h4 class="font-semibold text-slate-900">${esc(item.subStrand)}</h4>
                        ${n ? `<span class="rounded-full bg-indigo-600 px-2 py-0.5 text-[11px] font-bold text-white">In plan ${n}/${total}</span>` : ''}
                    </div>
                    ${item.subSubStrand ? `<p class="text-xs font-medium text-indigo-600">${esc(item.subSubStrand)}</p>` : ''}
                </div>
                <div class="flex flex-wrap items-center gap-1.5">${extra}</div>
            </div>
            <div><p class="eyebrow mb-0.5">Understanding</p><p class="font-medium leading-snug text-slate-900">${esc(item.statement) || '<span class="italic text-slate-400">No statement specified.</span>'}</p></div>
            <div class="grid gap-3 md:grid-cols-2">
                <div class="rounded-xl border border-blue-100 bg-blue-50/60 p-3">
                    <div class="mb-1 flex items-center justify-between gap-2">
                        <p class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-blue-800"><i class="fa-solid fa-brain"></i>Know</p>
                        ${item.knowList.length ? `<button data-act="all-kind" data-id="${item.id}" data-kind="knows" class="text-[11px] font-semibold text-blue-700 hover:underline">All / none</button>` : ''}
                    </div>
                    <div class="space-y-0.5 text-slate-700">${statementRows(item, 'knows', sel)}</div>
                </div>
                <div class="rounded-xl border border-emerald-100 bg-emerald-50/60 p-3">
                    <div class="mb-1 flex items-center justify-between gap-2">
                        <p class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-emerald-800"><i class="fa-solid fa-person-running"></i>Do</p>
                        ${item.doList.length ? `<button data-act="all-kind" data-id="${item.id}" data-kind="dos" class="text-[11px] font-semibold text-emerald-700 hover:underline">All / none</button>` : ''}
                    </div>
                    <div class="space-y-0.5 text-slate-700">${statementRows(item, 'dos', sel)}</div>
                </div>
            </div>
            <div class="flex flex-wrap justify-end gap-2">
                ${n ? `<button data-act="remove-from-browse" data-id="${item.id}" class="btn border-slate-200 bg-white text-slate-600 hover:bg-slate-50 !py-1.5 text-xs"><i class="fa-regular fa-trash-can"></i>Remove from plan</button>` : ''}
                <button data-act="add-all" data-id="${item.id}" class="btn border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 !py-1.5 text-xs"><i class="fa-solid fa-plus"></i>Add all Know &amp; Do</button>
            </div>
        </article>`;
    }

    function resultsHtml() {
        const list = browseItems();
        const shown = list.slice(0, state.limit);
        if (!list.length) {
            return `<div class="panel p-12 text-center text-slate-500"><i class="fa-regular fa-folder-open mb-3 text-3xl text-slate-300"></i>
                <p class="font-medium">No matching curriculum records</p><p class="mt-1 text-xs text-slate-400">Try a broader search or clear some filters.</p></div>`;
        }
        // group by area > strand
        const groups = [];
        shown.forEach(i => {
            const g = groups[groups.length - 1];
            if (g && g.area === i.area && g.strand === i.strand) g.items.push(i);
            else groups.push({ area: i.area, strand: i.strand, items: [i] });
        });
        return `<div class="flex flex-wrap items-center justify-between gap-2">
                <p class="text-xs font-medium text-slate-500">Showing ${shown.length} of ${list.length} records</p>
                <button data-act="add-shown" class="btn border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 !py-1.5 text-xs"><i class="fa-solid fa-plus"></i>Add all shown to plan</button>
            </div>` +
            groups.map(g => `<div class="space-y-3">
                <div class="area-bar"><h3 class="text-sm font-bold uppercase tracking-wide">${esc(g.area)} <span class="mx-1 opacity-60">›</span> ${esc(g.strand)}</h3>
                <span class="shrink-0 rounded-lg bg-white/20 px-2.5 py-1 text-xs font-medium">${g.items.length}</span></div>
                <div class="grid gap-4 xl:grid-cols-2">${g.items.map(cardHtml).join('')}</div></div>`).join('') +
            (list.length > shown.length ? `<div class="text-center"><button data-act="show-more" class="btn border-slate-200 bg-white text-slate-700 hover:bg-slate-50">Show ${Math.min(PAGE, list.length - shown.length)} more</button></div>` : '');
    }

        const menuScroll = $('#strandList') ? $('#strandList').scrollTop : 0;

        $('#app').innerHTML = `<section class="space-y-4">

                <div class="grid gap-3 md:grid-cols-2">
                    <div><label class="label" for="areaSel">Curriculum area</label>

                    <div><label class="label" for="searchBox">Search</label>

                    <div class="flex flex-wrap gap-1.5">${levels.map(l => `<button data-act="filter-level" data-v="${esc(l)}" class="chip ${f.levels.includes(l) ? levelClass(l) + ' ring-2 ring-indigo-300' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">${esc(l)}</button>`).join('')}</div></div>

                <div class="relative" data-menu-root>
                    <div class="mb-1 flex items-center justify-between"><span class="label !mb-0">Strand</span>

                    <button type="button" data-act="strand-menu" aria-expanded="${state.strandMenu}" class="field flex items-center justify-between gap-2 text-left font-medium">
                        <span class="truncate">${f.strands.length === 0 ? 'All strands' : f.strands.length === 1 ? esc(f.strands[0]) : f.strands.length + ' strands selected'}</span>
                        <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform ${state.strandMenu ? 'rotate-180' : ''}"></i></button>
                    ${state.strandMenu ? `<div class="absolute left-0 right-0 z-20 mt-1 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-lg">
                        <ul id="strandList" class="max-h-64 overflow-y-auto p-1">${strands.length ? strands.map(s => `<li><label class="flex cursor-pointer items-start gap-2.5 rounded-lg px-2.5 py-2 hover:bg-slate-50">
                            <input type="checkbox" class="mt-0.5 h-4 w-4 shrink-0 rounded border-slate-300 text-indigo-600" data-act="filter-strand" data-v="${esc(s)}"${f.strands.includes(s) ? ' checked' : ''}>
                            <span class="leading-snug">${esc(s)}</span></label></li>`).join('') : '<li class="px-3 py-3 text-center text-xs text-slate-400">No strands</li>'}</ul></div>` : ''}
                </div>
            </div>
            <div id="results" class="space-y-5">${resultsHtml()}</div>
        </section>`;
        if ($('#strandList')) $('#strandList').scrollTop = menuScroll;

    const refreshResults = () => { const r = $('#results'); if (r) r.innerHTML = resultsHtml(); };

    function refreshCard(id) {
        const item = state.byId.get(id), el = $(`[data-card="${id}"]`);
        if (item && el) el.outerHTML = cardHtml(item);
        renderHeader();
    }

    /* =====================================================================
       Plan tab
       ===================================================================== */
    function recordHtml(s) {
        const item = state.byKey.get(s.key);
        const n = onCount(s), total = s.knows.length + s.dos.length;
        const stmt = (kind, list) => list.length
            ? list.map((x, idx) => `<label class="flex cursor-pointer items-start gap-2.5 rounded-lg px-1.5 py-1 hover:bg-white/70">
                <input type="checkbox" class="mt-0.5 h-4 w-4 shrink-0 rounded border-slate-300 text-indigo-600" data-act="rec-toggle" data-key="${esc(s.key)}" data-kind="${kind}" data-idx="${idx}"${x.on ? ' checked' : ''}>
                <span class="leading-snug ${x.on ? '' : 'text-slate-400'}">${esc(x.text)}</span></label>`).join('')
            : '<p class="text-xs italic text-slate-400">None specified.</p>';

        ].join('') : '';
        return `<details data-rec="${esc(s.key)}" class="panel overflow-hidden"${state.openRecs.has(s.key) ? ' open' : ''}>
            <summary class="flex cursor-pointer items-center justify-between gap-3 px-4 py-3 hover:bg-slate-50">
                <span class="flex min-w-0 items-center gap-2.5"><i class="fa-solid fa-chevron-right chev w-3 shrink-0 text-xs text-slate-400 transition-transform"></i>
                    <span class="min-w-0"><span class="flex flex-wrap items-center gap-2"><span class="badge ${levelClass(s.level)}">${esc(s.level)}</span>
                        <span class="font-semibold text-slate-900">${esc(s.subStrand)}</span></span>
                    <span class="mt-0.5 block truncate text-xs text-slate-500">${esc(s.strand)}</span></span></span>
                <span class="flex shrink-0 items-center gap-2"><span data-status-pill="${esc(s.key)}" class="badge ${STATUS_CLASS[s.status]}">${esc(s.status)}</span>
                    <span class="rounded-full bg-indigo-100 px-2 py-0.5 text-[11px] font-bold text-indigo-800">${n}/${total}</span></span>
            </summary>
            <div class="space-y-4 border-t border-slate-100 p-4">
                <div><p class="eyebrow mb-0.5">Understanding</p><p class="font-medium leading-snug text-slate-900">${esc(s.statement) || '<span class="italic text-slate-400">No statement specified.</span>'}</p></div>
                <div class="grid gap-3 md:grid-cols-2">
                    <div class="rounded-xl border border-blue-100 bg-blue-50/60 p-3"><p class="mb-1 flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-blue-800"><i class="fa-solid fa-brain"></i>Know</p><div class="space-y-0.5 text-slate-700">${stmt('knows', s.knows)}</div></div>
                    <div class="rounded-xl border border-emerald-100 bg-emerald-50/60 p-3"><p class="mb-1 flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-emerald-800"><i class="fa-solid fa-person-running"></i>Do</p><div class="space-y-0.5 text-slate-700">${stmt('dos', s.dos)}</div></div>
                </div>
                <div class="grid gap-3 md:grid-cols-3">
                    ${areaField('planning', 'Planning notes / activities', 'How will you teach this?')}
                    ${areaField('assessment', 'Assessment', 'How will you know learners have got it? Success criteria, task, method…')}
                    ${areaField('evidence', 'Evidence and next steps', 'What did you see or collect? What happens next?')}
                </div>
                <div class="flex flex-wrap items-end justify-between gap-3">
                    <div><label class="label" for="st-${esc(s.key)}">Status</label>
                        <select id="st-${esc(s.key)}" data-act="status" data-key="${esc(s.key)}" class="field !w-auto font-medium">
                            ${STATUSES.map(x => `<option${x === s.status ? ' selected' : ''}>${x}</option>`).join('')}</select></div>
                    <div class="flex flex-wrap items-center gap-2">${buttons}
                        <button data-act="rec-remove" data-key="${esc(s.key)}" class="btn border-red-200 bg-white text-red-600 hover:bg-red-50 !py-1.5 text-xs"><i class="fa-regular fa-trash-can"></i>Remove</button></div>

    function renderPlan() {
        const p = plan();
        const sels = selectionsSorted(p);
        const cov = computeCoverage(p, false);
        const details = `<details data-plan-details class="panel overflow-hidden"${state.detailsOpen ? ' open' : ''}>
            <summary class="flex cursor-pointer items-center justify-between gap-3 px-4 py-3.5 hover:bg-slate-50 sm:px-5">
                <h2 class="flex items-center gap-2 text-base font-bold text-slate-900"><i class="fa-solid fa-chevron-right chev w-3 text-xs text-slate-400 transition-transform"></i><i class="fa-solid fa-circle-info text-indigo-500"></i>Plan details</h2>
                <span class="hidden truncate text-xs text-slate-400 sm:block">Title, class, intentions, activities, resources, assessment…</span></summary>
            <div class="space-y-4 border-t border-slate-100 p-4 sm:p-5">
            <div class="grid gap-3 md:grid-cols-2">

                <div><label class="label" for="f-teacher">Teacher</label><input id="f-teacher" class="field" data-plan-field="teacher" value="${esc(p.teacher)}"></div>
                <div><label class="label" for="f-class">Class / group</label><input id="f-class" class="field" data-plan-field="classGroup" value="${esc(p.classGroup)}"></div>
                <div class="md:col-span-2"><label class="label" for="f-time">Timeframe</label><input id="f-time" class="field" data-plan-field="timeframe" value="${esc(p.timeframe)}" placeholder="e.g. Term 2, weeks 1–6"></div>
            </div>
            <div class="grid gap-3 md:grid-cols-2">${PLAN_FIELDS.map(([k, label, ph, rows]) =>
                `<div class="${k === 'activities' ? 'md:col-span-2' : ''}"><label class="label" for="f-${k}">${label}</label>
                 <textarea id="f-${k}" rows="${rows}" class="field" data-plan-field="${k}" placeholder="${esc(ph)}">${esc(p[k])}</textarea></div>`).join('')}</div>
            </div></details>`;

        const planned = sels.length ? `<div class="space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <h2 class="flex items-center gap-2 text-base font-bold text-slate-900"><i class="fa-solid fa-list-check text-indigo-500"></i>Planned curriculum</h2>
                <div class="flex flex-wrap gap-2">
                    <button data-act="expand-recs" class="btn border-slate-200 bg-white text-slate-600 hover:bg-slate-50 !py-1.5 text-xs"><i class="fa-solid fa-square-plus"></i>Expand all</button>
                    <button data-act="collapse-recs" class="btn border-slate-200 bg-white text-slate-600 hover:bg-slate-50 !py-1.5 text-xs"><i class="fa-solid fa-square-minus"></i>Collapse all</button>
                    <button data-act="tab" data-tab="browse" class="btn border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 !py-1.5 text-xs"><i class="fa-solid fa-plus"></i>Add more</button>
                </div></div>
            ${(() => { let out = '', cur = ''; sels.forEach(s => {
                if (s.area !== cur) { cur = s.area; out += `<div class="area-bar mt-2"><h3 class="text-sm font-bold uppercase tracking-wide">${esc(cur)}</h3></div>`; }

            : `<div class="panel p-10 text-center text-slate-500"><i class="fa-solid fa-seedling mb-3 text-3xl text-slate-300"></i>
                <p class="font-medium text-slate-700">Nothing planned yet</p><p class="mx-auto mt-1 max-w-sm text-xs">Browse the curriculum and tick the Know and Do statements you want to teach. They'll appear here for planning and assessment details.</p>
                <button data-act="tab" data-tab="browse" class="btn mt-4 border-indigo-600 bg-indigo-600 text-white hover:bg-indigo-700"><i class="fa-solid fa-magnifying-glass"></i>Browse curriculum</button></div>`;

        $('#app').innerHTML = `<section class="space-y-5">
            <div class="panel flex flex-wrap items-center justify-between gap-3 p-4">
                <p class="font-medium text-slate-700"><b class="text-slate-900">${cov.totals.touched}</b> record${cov.totals.touched === 1 ? '' : 's'} planned · <b class="text-slate-900">${cov.totals.planned}</b> Know &amp; Do statements · <b class="text-slate-900">${cov.areas.length}</b> area${cov.areas.length === 1 ? '' : 's'}</p>
                <button data-act="tab" data-tab="coverage" class="btn border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 !py-1.5 text-xs"><i class="fa-solid fa-chart-simple"></i>View coverage</button>

    /* =====================================================================
       Coverage tab
       ===================================================================== */
    function covCell(c) {
        if (!c) return '<td class="bg-slate-50 text-slate-300">–</td>';
        const r = c.statements ? c.planned / c.statements : 0;
        const cls = r === 0 ? 'bg-slate-50 text-slate-400' : r < 0.34 ? 'bg-indigo-50 text-indigo-800' : r < 0.67 ? 'bg-indigo-100 text-indigo-900' : r < 1 ? 'bg-indigo-200 text-indigo-900' : 'bg-emerald-200 text-emerald-900';
        return `<td class="${cls}" title="${c.touched} of ${c.records} records · ${c.planned} of ${c.statements} Know &amp; Do statements"><div class="font-bold">${c.touched}/${c.records}</div><div class="text-[10px] opacity-80">${c.planned}/${c.statements}</div></td>`;
    }

    function renderCoverage() {
        const p = plan();
        const cov = computeCoverage(p, state.covAll);
        const T = cov.totals;
        const touched = selectionsSorted(p).filter(s => onCount(s) > 0);
        const byStatus = STATUSES.map(st => [st, touched.filter(s => s.status === st).length]);

        const tile = (label, n, d, icon) => `<div class="panel space-y-2 p-4"><p class="flex items-center gap-2 text-xs font-semibold text-slate-500"><i class="fa-solid ${icon} text-indigo-500"></i>${label}</p>
            <p class="text-2xl font-bold text-slate-900">${n}<span class="text-base font-medium text-slate-400"> / ${d}</span></p>${progressBar(n, d)}<p class="text-xs text-slate-500">${pct(n, d)}% of ${state.covAll ? 'the curriculum' : 'the areas in this plan'}</p></div>`;

        const scopeToggle = `<div class="inline-flex rounded-xl bg-slate-200/70 p-1">
            ${[[false, 'Areas in this plan'], [true, 'Whole curriculum']].map(([v, l]) => `<button data-act="cov-scope" data-v="${v}" class="rounded-lg px-3 py-1.5 text-xs font-semibold transition ${state.covAll === v ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">${l}</button>`).join('')}</div>`;

        if (!touched.length && !state.covAll) {
            $('#app').innerHTML = `<section class="space-y-4"><div class="flex justify-end">${scopeToggle}</div>
                <div class="panel p-10 text-center text-slate-500"><i class="fa-solid fa-chart-simple mb-3 text-3xl text-slate-300"></i>
                <p class="font-medium text-slate-700">No coverage to show yet</p><p class="mx-auto mt-1 max-w-sm text-xs">Add Know and Do statements to your plan and your curriculum coverage will build up here.</p>
                <button data-act="tab" data-tab="browse" class="btn mt-4 border-indigo-600 bg-indigo-600 text-white hover:bg-indigo-700">Browse curriculum</button></div></section>`;
            return;
        }

                ${tile('Know &amp; Do statements', T.planned, T.statements, 'fa-brain')}
                <div class="panel space-y-2 p-4 sm:col-span-2"><p class="flex items-center gap-2 text-xs font-semibold text-slate-500"><i class="fa-solid fa-flag text-indigo-500"></i>Progress through your plan</p>
                    <div class="flex flex-wrap gap-2">${byStatus.map(([st, n]) => `<span class="badge ${STATUS_CLASS[st]} !text-xs">${st}: ${n}</span>`).join('')}</div>
                    <p class="text-xs text-slate-500">Set a record's status in <b>My plan</b> as you teach and assess it.</p></div>

    /* =====================================================================
       Export
       ===================================================================== */
    const DOC_CSS = `
        .plan-doc { font-family: Calibri, Arial, sans-serif; font-size: 11pt; color: #111827; line-height: 1.4; }
        .plan-doc h1 { font-size: 20pt; margin: 0 0 4pt; color: #312e81; }
        .plan-doc h2 { font-size: 14pt; margin: 16pt 0 4pt; color: #312e81; border-bottom: 1pt solid #c7d2fe; padding-bottom: 2pt; }
        .plan-doc h3 { font-size: 11.5pt; margin: 12pt 0 2pt; color: #1e1b4b; }
        .plan-doc p { margin: 0 0 5pt; }
        .plan-doc table { border-collapse: collapse; width: 100%; margin: 4pt 0 8pt; }
        .plan-doc th, .plan-doc td { border: 1pt solid #cbd5e1; padding: 3pt 5pt; vertical-align: top; text-align: left; font-size: 10pt; }
        .plan-doc th { background: #eef2ff; }
        .plan-doc td.know { background: #eff6ff; } .plan-doc td.do { background: #ecfdf5; }
        .plan-doc ul { margin: 2pt 0 4pt 16pt; padding: 0; }
        .plan-doc table.meta { width: auto; }
        .plan-doc .meta td { border: none; padding: 1pt 12pt 1pt 0; }
        .plan-doc .muted { color: #64748b; font-size: 9.5pt; }
        .plan-doc .rec { page-break-inside: avoid; margin-bottom: 8pt; }
        .plan-doc .dlabel { font-weight: bold; color: #475569; font-size: 9.5pt; text-transform: uppercase; }
    `;

    function buildDocHtml(p) {
        const cov = computeCoverage(p, false);
        const sels = selectionsSorted(p).filter(s => onCount(s) > 0 || hasText(s));
        const sec = (title, body) => body.trim() ? `<h2>${title}</h2>${body}` : '';
        const meta = [['Teacher', p.teacher], ['Class / group', p.classGroup], ['Timeframe', p.timeframe],
            ['Prepared', new Date(p.updated).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })]]
            .filter(([, v]) => str(v).trim());
        const lists = (s, kind) => { const on = s[kind].filter(x => x.on); return on.length ? `<ul>${on.map(x => `<li>${esc(x.text)}</li>`).join('')}</ul>` : '<span class="muted">None selected.</span>'; };
        const field = (label, t) => t.trim() ? `<p><span class="dlabel">${label}</span><br>${esc(t).replace(/\r?\n/g, '<br>')}</p>` : '';

        let html = `<h1>${esc(p.title || 'Learning plan')}</h1>
            <table class="meta">${meta.map(([k, v]) => `<tr><td><b>${k}</b></td><td>${esc(v)}</td></tr>`).join('')}</table>`;
        html += sec('Learning intentions', para(p.intentions));
        html += sec('Teaching and learning activities', para(p.activities));
        html += sec('Resources', para(p.resources));
        html += sec('Differentiation and inclusion', para(p.differentiation));
        html += sec('Assessment overview', para(p.assessmentOverview));

        if (sels.length) {
            html += `<h2>Curriculum coverage</h2><p>${cov.totals.touched} record${cov.totals.touched === 1 ? '' : 's'} and ${cov.totals.planned} Know &amp; Do statements planned across ${cov.areas.length} curriculum area${cov.areas.length === 1 ? '' : 's'}.</p>
                <table><tr><th>Curriculum area</th><th>Strand</th><th>Levels planned</th><th>Records planned</th><th>Know &amp; Do planned</th></tr>
                ${cov.areas.map(A => A.strands.filter(S => S.touched > 0).map(S => `<tr><td>${esc(A.area)}</td><td>${esc(S.strand)}</td>
                    <td>${esc([...S.cells.entries()].filter(([, c]) => c.touched > 0).map(([l]) => l).sort(compareLevels).join(', '))}</td>
                    <td>${S.touched} of ${S.records}</td><td>${S.planned} of ${S.statements}</td></tr>`).join('')).join('')}</table>`;

            html += '<h2>Planned curriculum</h2>';
            let area = '';
            sels.forEach(s => {
                if (s.area !== area) { area = s.area; html += `<h3 style="font-size:12.5pt;color:#312e81;margin-top:14pt">${esc(area)}</h3>`; }
                html += `<div class="rec"><h3>${esc(s.level)} · ${esc(s.strand)} › ${esc(s.subStrand)}${s.subSubStrand ? ' (' + esc(s.subSubStrand) + ')' : ''} <span class="muted">— ${esc(s.status)}</span></h3>
                    <p><span class="dlabel">Understanding</span><br>${esc(s.statement) || '—'}</p>
                    <table><tr><th>Know</th><th>Do</th></tr><tr><td class="know">${lists(s, 'knows')}</td><td class="do">${lists(s, 'dos')}</td></tr></table>
                    ${field('Planning notes / activities', s.planning)}${field('Assessment', s.assessment)}${field('Evidence and next steps', s.evidence)}</div>`;
            });
        }
        html += sec('Reflection and next steps', para(p.reflection));
        return html;
    }

    function exportPrint() {
        $('#printDoc').innerHTML = `<style>${DOC_CSS}</style>` + buildDocHtml(plan());
        const prev = document.title;
        document.title = plan().title || 'Learning plan';
        window.print();
        document.title = prev;
    }

    function exportWord() {
        const p = plan();
        const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>${esc(p.title)}</title><style>${DOC_CSS}</style></head><body class="plan-doc">${buildDocHtml(p)}</body></html>`;
        download(slug(p.title) + '.doc', 'application/msword;charset=utf-8', '﻿' + doc);

    function exportJson() {
        const p = plan();
        download(slug(p.title) + '.plan.json', 'application/json', JSON.stringify({ app: 'cic-planner', version: 1, exported: new Date().toISOString(), plan: p }, null, 2));
        toast('Plan file downloaded');
    }

    function importJson(text) {
        let data;
        try { data = JSON.parse(text); } catch (e) { toast('That file is not valid JSON.'); return; }
        const raw = data && data.app === 'cic-planner' ? data.plan : null;
        if (!raw || typeof raw !== 'object' || typeof raw.selections !== 'object') { toast("That doesn't look like a planner file."); return; }
        const p = normalisePlan(raw);
        p.id = newId();
        state.plans.push(p); state.currentId = p.id; state.tab = 'plan';
        saveNow(); render();
        toast('Plan imported');
    }


    /* =====================================================================
       Mind map tab: Understand / Know / Do branches around the plan
       ===================================================================== */
    const MM_KINDS = { u: { label: 'Understand', icon: 'fa-lightbulb' }, k: { label: 'Know', icon: 'fa-brain' }, d: { label: 'Do', icon: 'fa-hand' } };
    const MM_LINE = { u: '#d97706', k: '#0284c7', d: '#059669' };

    // Builds { u|k|d: [{ label, leaves: [{ text, levels[] }] }] } from the ticked statements of a plan.
    function buildMindMapData(p) {
        const sels = selectionsSorted(p).filter(s => onCount(s) > 0);
        const multi = new Set(sels.map(s => s.area)).size > 1;
        const out = { u: new Map(), k: new Map(), d: new Map() };
        const put = (kind, s, text) => {
            const label = (multi ? s.area + ' · ' : '') + (s.strand || 'General');
            if (!out[kind].has(label)) out[kind].set(label, new Map());
            const leaves = out[kind].get(label);
            if (!leaves.has(text)) leaves.set(text, new Set());
            leaves.get(text).add(s.level);
        };
        sels.forEach(s => {
            if (str(s.statement).trim()) put('u', s, s.statement.trim());
            s.knows.filter(x => x.on).forEach(x => put('k', s, x.text));
            s.dos.filter(x => x.on).forEach(x => put('d', s, x.text));
        });
        const res = {};
        Object.keys(out).forEach(k => {
            res[k] = [...out[k].entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([label, leaves]) => ({
                label, leaves: [...leaves.entries()].map(([text, lv]) => ({ text, levels: [...lv].sort(compareLevels) }))
            }));
        });
        return { data: res, records: sels.length, multi };
    }

    const mmRadial = () => window.innerWidth >= 1100;

    function renderMindMap() {
        const p = plan();
        const { data, records } = buildMindMapData(p);
        const count = k => data[k].reduce((n, c) => n + c.leaves.length, 0);
        const full = state.mmDetail === 'full';

        if (!records) {
            $('#app').innerHTML = `<div class="panel p-10 text-center text-slate-500"><i class="fa-solid fa-diagram-project mb-3 text-3xl text-slate-300"></i>
                <p class="font-medium text-slate-700">No mind map yet</p><p class="mx-auto mt-1 max-w-sm text-xs">Tick Know and Do statements in your plan and the Understand, Know and Do overview will be drawn here.</p>
                <button data-act="tab" data-tab="browse" class="btn mt-4 border-indigo-600 bg-indigo-600 text-white hover:bg-indigo-700">Browse curriculum</button></div>`;
            return;
        }

        const group = k => {
            const clusters = data[k];
            if (!clusters.length) return '';
            const body = clusters.map((c, ci) => {
                const sid = `s-${k}-${ci}`;
                const leaves = full ? `<div class="mm-leaves">${c.leaves.map((l, li) =>
                    `<div class="mm-leaf" data-mm-id="l-${k}-${ci}-${li}" data-mm-parent="${sid}" data-mm-kind="${k}" data-mm-w="1.6">${
                        l.levels.length ? `<span class="lv">${l.levels.map(x => esc(levelShort(x))).join('/')}</span>` : ''}${esc(l.text)}</div>`).join('')}</div>` : '';
                return `<div class="mm-cluster"><div class="mm-strand" data-mm-id="${sid}" data-mm-parent="h-${k}" data-mm-kind="${k}" data-mm-w="2.4">${esc(c.label)}<small>${c.leaves.length} statement${c.leaves.length === 1 ? '' : 's'}</small></div>${leaves}</div>`;
            }).join('');
            return `<div class="mm-group mm-${k}"><div class="mm-hub" data-mm-id="h-${k}" data-mm-parent="core" data-mm-kind="${k}" data-mm-w="3.6"><i class="fa-solid ${MM_KINDS[k].icon} mr-1.5"></i>${MM_KINDS[k].label}<small>${count(k)}</small></div><div class="mm-clusters">${body}</div></div>`;
        };

        const toggle = `<div class="inline-flex rounded-xl bg-slate-200/70 p-1">${[['full', 'With statements'], ['strands', 'Strands only']].map(([v, l]) =>
            `<button data-act="mm-detail" data-v="${v}" class="rounded-lg px-3 py-1.5 text-xs font-semibold transition ${state.mmDetail === v ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">${l}</button>`).join('')}</div>`;
        const legend = ['u', 'k', 'd'].map(k => `<span class="mm-${k} inline-flex items-center gap-1.5 text-xs font-semibold" style="color:var(--c)"><span class="h-2.5 w-2.5 rounded-full" style="background:var(--c)"></span>${MM_KINDS[k].label} (${count(k)})</span>`).join('');

        $('#app').innerHTML = `<section class="space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex flex-wrap items-center gap-x-4 gap-y-1">${legend}</div>
                ${toggle}
            </div>
            <div class="panel mm-scroll"><div id="mm" class="mm${mmRadial() ? ' is-radial' : ''}">
                <svg class="mm-svg" id="mmSvg" aria-hidden="true"></svg>
                <div class="mm-grid">
                    <div class="mm-side mm-left">${group('u')}</div>
                    <div><div class="mm-core" data-mm-id="core">${esc(p.title || 'Untitled plan')}<small>${records} record${records === 1 ? '' : 's'} planned</small></div></div>
                    <div class="mm-side mm-right">${group('k')}${group('d')}</div>
                </div></div></div>
            <p class="text-center text-xs text-slate-400">Built from the statements ticked in your plan. Understand comes from each planned record's understanding statement.</p>
        </section>`;
        drawMindMap();
    }

    function drawMindMap() {
        const mm = $('#mm'), svg = $('#mmSvg');
        if (!mm || !svg) return;
        const radial = mmRadial();
        mm.classList.toggle('is-radial', radial);
        svg.innerHTML = '';
        if (!radial) { svg.style.display = 'none'; return; }
        svg.style.display = '';
        const box = mm.getBoundingClientRect();
        svg.setAttribute('width', mm.scrollWidth); svg.setAttribute('height', mm.scrollHeight);
        const rect = el => { const r = el.getBoundingClientRect(); return { l: r.left - box.left, r: r.right - box.left, y: r.top - box.top + r.height / 2 }; };
        let paths = '';
        $$('[data-mm-parent]', mm).forEach(el => {
            const par = mm.querySelector(`[data-mm-id="${el.dataset.mmParent}"]`);
            if (!par) return;
            const a = rect(par), b = rect(el);
            const right = (b.l + b.r) / 2 > (a.l + a.r) / 2;
            const x1 = right ? a.r : a.l, x2 = right ? b.l : b.r, mx = (x1 + x2) / 2;
            paths += `<path d="M${x1.toFixed(1)},${a.y.toFixed(1)} C${mx.toFixed(1)},${a.y.toFixed(1)} ${mx.toFixed(1)},${b.y.toFixed(1)} ${x2.toFixed(1)},${b.y.toFixed(1)}" stroke="${MM_LINE[el.dataset.mmKind]}" stroke-width="${el.dataset.mmW}" opacity="0.65"/>`;
        });
        svg.innerHTML = paths;
    }
    window.addEventListener('resize', () => {
        if (state.tab !== 'mindmap' || !$('#mm')) return;
        clearTimeout(drawMindMap.t); drawMindMap.t = setTimeout(drawMindMap, 80);
    });

    /* =====================================================================
       Rendering + events
       ===================================================================== */
    function render() {
        renderHeader();
        if (state.loading) {
            $('#app').innerHTML = `<div class="flex flex-col items-center justify-center space-y-4 py-24"><div class="h-12 w-12 animate-spin rounded-full border-4 border-indigo-200 border-t-indigo-600"></div><p class="animate-pulse font-medium text-slate-600">Loading curriculum data…</p></div>`;
        } else if (state.error) {
            $('#app').innerHTML = `<div class="mx-auto my-10 max-w-lg rounded-2xl border border-red-200 bg-red-50 p-6 text-center shadow-sm"><h3 class="mb-1 font-semibold text-red-900">Failed to load curriculum</h3>
                <p class="mb-4 text-red-600">${esc(state.error)}</p><button data-act="retry" class="btn border-red-600 bg-red-600 text-white hover:bg-red-700">Try again</button></div>`;
        } else if (state.tab === 'browse') renderBrowse();
        else if (state.tab === 'plan') renderPlan();
        else if (state.tab === 'mindmap') renderMindMap();
        else renderCoverage();
    }

    function setTab(t) { state.tab = t; state.menu = null; state.strandMenu = false; render(); window.scrollTo({ top: 0 }); }

    const itemOf = el => state.byId.get(Number(el.dataset.id));

    document.addEventListener('click', e => {
        const el = e.target.closest('[data-act]');
        // click outside any open menu closes it
        if (!e.target.closest('[data-menu-root]')) {
            if (state.menu) { state.menu = null; renderHeader(); }
            if (state.strandMenu) {
                // Close surgically: re-rendering here would replace the element being clicked and lose the click.
                state.strandMenu = false;
                const list = $('#strandList');
                if (list) list.parentElement.remove();
                const btn = $('[data-act="strand-menu"]');
                if (btn) btn.setAttribute('aria-expanded', 'false');
            }
        }
        if (!el) return;
        const act = el.dataset.act;
        if (act === 'modal-bg') { if (e.target === el) closeModal(); return; }
        if (el.tagName === 'INPUT' || el.tagName === 'SELECT' || act === 'toggle') return;   // handled by 'change'
        const item = el.dataset.id !== undefined ? itemOf(el) : null;

        switch (act) {
            case 'tab': setTab(el.dataset.tab); break;
            case 'menu': state.menu = state.menu === el.dataset.menu ? null : el.dataset.menu; renderHeader(); break;
            case 'new-plan': {
                const p = newPlan(); state.plans.push(p); state.currentId = p.id; state.tab = 'plan'; state.menu = null; state.detailsOpen = true;
                saveNow(); render(); setTimeout(() => { const t = $('#f-title'); if (t) { t.focus(); t.select(); } }, 0); break; }
            case 'duplicate-plan': {
                const c = normalisePlan(JSON.parse(JSON.stringify(plan()))); c.id = newId(); c.title = (plan().title || 'Untitled plan') + ' (copy)';
                state.plans.push(c); state.currentId = c.id; state.menu = null; saveNow(); render(); toast('Plan duplicated'); break; }
            case 'delete-plan': {
                state.menu = null;
                if (confirm(`Delete "${plan().title || 'Untitled plan'}"? This can't be undone.`)) {
                    state.plans = state.plans.filter(p => p.id !== state.currentId);
                    if (!state.plans.length) state.plans = [newPlan()];
                    state.currentId = state.plans[0].id; saveNow(); render(); toast('Plan deleted');
                } else renderHeader();
                break; }
            case 'import': state.menu = null; renderHeader(); $('#importFile').click(); break;
            case 'export-print': state.menu = null; renderHeader(); exportPrint(); break;
            case 'export-word': state.menu = null; renderHeader(); exportWord(); break;
            case 'export-json': state.menu = null; renderHeader(); exportJson(); break;
            case 'retry': init(); break;

            case 'filter-level': {
                const v = el.dataset.v, a = state.filters.levels, i = a.indexOf(v);
                i > -1 ? a.splice(i, 1) : a.push(v); pruneFilters(); state.limit = PAGE; renderBrowse(); break; }
            case 'clear-levels': state.filters.levels = []; pruneFilters(); state.limit = PAGE; renderBrowse(); break;
            case 'clear-strands': state.filters.strands = []; state.limit = PAGE; renderBrowse(); break;
            case 'strand-menu': state.strandMenu = !state.strandMenu; renderBrowse(); break;
            case 'show-more': state.limit += PAGE; refreshResults(); break;

            case 'all-kind': {   // tick all, or untick all if everything is already ticked
                const sel = ensureSel(item), list = item[el.dataset.kind === 'knows' ? 'knowList' : 'doList'];
                const allOn = list.every(t => sel[el.dataset.kind].some(x => x.text === t && x.on));
                list.forEach(t => setStatement(sel, el.dataset.kind, t, !allOn));
                dropIfEmpty(sel); touch(); refreshCard(item.id); break; }
            case 'add-all': {
                const sel = ensureSel(item);
                item.knowList.forEach(t => setStatement(sel, 'knows', t, true)); item.doList.forEach(t => setStatement(sel, 'dos', t, true));
                touch(); refreshCard(item.id); toast('Added to your plan'); break; }
            case 'remove-from-browse': {
                const sel = plan().selections[itemKey(item)];
                if (sel && (!hasText(sel) || confirm('This record has planning or assessment notes. Remove it anyway?'))) { delete plan().selections[sel.key]; touch(); refreshCard(item.id); }
                break; }
            case 'add-shown': {
                const list = browseItems();
                if (list.length > 25 && !confirm(`Add all Know & Do statements from ${list.length} records to your plan?`)) break;
                list.forEach(i => { const sel = ensureSel(i); i.knowList.forEach(t => setStatement(sel, 'knows', t, true)); i.doList.forEach(t => setStatement(sel, 'dos', t, true)); });
                touch(); renderBrowse(); toast(`Added ${list.length} record${list.length === 1 ? '' : 's'} to your plan`); break; }

            case 'rec-remove': {
                const s = plan().selections[el.dataset.key];
                if (s && (!hasText(s) || confirm('This record has planning or assessment notes. Remove it anyway?'))) { delete plan().selections[s.key]; state.openRecs.delete(s.key); touch(); renderPlan(); renderHeader(); }
                break; }
            case 'expand-recs': Object.keys(plan().selections).forEach(k => state.openRecs.add(k)); renderPlan(); break;
            case 'collapse-recs': state.openRecs.clear(); renderPlan(); break;

            case 'mm-detail': state.mmDetail = el.dataset.v; renderMindMap(); break;
            case 'cov-scope': state.covAll = el.dataset.v === 'true'; renderCoverage(); break;

            case 'notes': if (item) notesModal(item); break;
            case 'more': if (item) moreModal(item); break;
            case 'close-modal': closeModal(); break;
        }
    });

    document.addEventListener('change', e => {
        const el = e.target, act = el.dataset.act;
        if (el.id === 'importFile') {
            const f = el.files && el.files[0];
            if (f) { const r = new FileReader(); r.onload = () => importJson(String(r.result)); r.readAsText(f); }
            el.value = ''; return;
        }
        if (act === 'switch-plan') { state.currentId = el.value; state.openRecs.clear(); saveNow(); render(); return; }
        if (act === 'filter-area') { state.filters.area = el.value; pruneFilters(); state.limit = PAGE; renderBrowse(); return; }
        if (act === 'filter-strand') {
            const v = el.dataset.v, a = state.filters.strands, i = a.indexOf(v);
            el.checked ? (i < 0 && a.push(v)) : (i > -1 && a.splice(i, 1));
            state.limit = PAGE; renderBrowse(); return;
        }
        if (act === 'toggle') {
            const item = itemOf(el), kind = el.dataset.kind, text = (kind === 'knows' ? item.knowList : item.doList)[Number(el.dataset.idx)];
            const sel = ensureSel(item); setStatement(sel, kind, text, el.checked);
            dropIfEmpty(sel); touch(); refreshCard(item.id); return;
        }
        if (act === 'rec-toggle') {
            const s = plan().selections[el.dataset.key]; if (!s) return;
            s[el.dataset.kind][Number(el.dataset.idx)].on = el.checked; touch();
            const open = state.openRecs.has(s.key);
            renderPlan(); renderHeader();
            if (open) { const d = $(`[data-rec="${CSS.escape(s.key)}"]`); if (d) d.open = true; }
            return;
        }
        if (act === 'status') {
            const s = plan().selections[el.dataset.key]; if (!s) return;
            s.status = el.value; touch();
            const pill = $(`[data-status-pill="${CSS.escape(s.key)}"]`);
            if (pill) { pill.textContent = s.status; pill.className = 'badge ' + STATUS_CLASS[s.status]; }
        }
    });

    document.addEventListener('input', e => {
        const el = e.target;
        if (el.dataset.act === 'filter-search') { state.filters.search = el.value; state.limit = PAGE; refreshResults(); return; }
        if (el.dataset.planField) {
            plan()[el.dataset.planField] = el.value; touch();
            if (el.dataset.planField === 'title') renderHeader();
            return;
        }
        if (el.dataset.recField) {
            const s = plan().selections[el.dataset.key]; if (s) { s[el.dataset.recField] = el.value; touch(); }
        }
    });

    // <details> open state for planned records (toggle doesn't bubble, so listen in capture)
    document.addEventListener('toggle', e => {
        const d = e.target;
        if (!d || !d.dataset) return;
        if (d.dataset.planDetails !== undefined) state.detailsOpen = d.open;
        else if (d.dataset.rec !== undefined) d.open ? state.openRecs.add(d.dataset.rec) : state.openRecs.delete(d.dataset.rec);
    }, true);

    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        if ($('#modalRoot').firstChild) closeModal();
        else if (state.menu || state.strandMenu) { state.menu = null; state.strandMenu = false; renderHeader(); if (state.tab === 'browse') renderBrowse(); }
    });

    /* =====================================================================
       Data loading
       ===================================================================== */
    async function loadVocab() {
        try { state.vocab = buildVocab(await fetchCsvRows(VOCAB_URL)); state.vocabLoaded = true; }
        catch (err) { console.warn('Could not load vocabulary definitions:', err); state.vocabFailed = true; }
    }

    async function init() {
        state.loading = true; state.error = null; render();
        loadVocab();
        try {
            const { items } = buildItems(await fetchCsvRows(CSV_URL));
            state.items = items;
            state.byId = new Map(items.map(i => [i.id, i]));
            state.byKey = new Map();
            items.forEach(i => { const k = itemKey(i); if (!state.byKey.has(k)) state.byKey.set(k, i); });
        } catch (err) {
            console.error('Fetch error:', err);
            state.error = 'Could not load curriculum data (' + (err && err.message ? err.message : 'network or CORS error') + ').' +
                (location.protocol === 'file:' ? ' This page is open via file:// – serve it over http(s) (e.g. GitHub Pages) and try again.' : ' Check the sheet is still published to the web as CSV.');
        }
        state.loading = false;
        render();
    }

    loadStore();
    init();
    })();
    </script>
</body>
